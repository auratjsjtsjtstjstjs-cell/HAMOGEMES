<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DEAL OR NO DEAL</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Cairo',sans-serif;padding:10px}
.stats{display:flex;justify-content:space-between;background:#111;padding:12px;border-radius:10px;margin-bottom:10px;font-weight:900}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:linear-gradient(90deg,#ffd700,#ff8c00);color:#000;padding:12px;border-radius:10px;text-align:center;font-weight:900;margin:10px 0;font-size:20px}
.field{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:#111;border:2px solid #333;border-radius:10px;padding:10px}
.slot{border:2px solid #555;background:#000;margin:4px;padding:8px;border-radius:8px;font-size:13px;font-weight:700;min-height:35px}
.slot.filled{border-color:#ffd700;background:#1a1a1a}
.rating{color:#ffd700;font-size:10px}
.choice-box{display:flex;gap:15px;justify-content:center;margin:20px 0}
.card-choice{width:45%;background:rgba(0,0,0,0.7);border:3px solid #444;border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:0.3s}
.card-choice:hover{border-color:#ffd700;transform:scale(1.05);background:#1a1a1a}
.card-choice.waiting{opacity:0.5;pointer-events:none}
.card-choice.name{font-size:20px;font-weight:900;color:#ffd700;margin:8px 0}
.card-choice.mystery{font-size:50px}
.card-choice.rate{color:#00ff88;font-size:12px}
.vs{font-size:30px;color:#ff4444;font-weight:900;align-self:center}
.status{color:#00ff88;font-size:14px;margin-top:5px}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:999}
.ball{width:100px;height:100px;border-radius:50%;border:5px solid gold;border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
#result{margin-top:20px;font-size:28px;font-weight:900;color:gold;text-align:center}
.score{font-size:20px;color:#aaa}
</style>
</head>
<body>

<div class="stats">
  <div class="p1"><span id="myName">انت</span> <span class="status" id="myStatus"></span></div>
  <div id="count">1 / 11</div>
  <div class="p2">AI <span class="status" id="aiStatus"></span></div>
</div>

<div class="turn" id="turn">دورك: اختر لاعب لمركز GK</div>

<div class="choice-box" id="choiceBox">
  <div class="card-choice" id="choice1" onclick="pick(1)">
    <div class="name" id="name1"></div>
    <div class="rate" id="rate1"></div>
    <div style="color:#aaa;font-size:12px" id="pos1"></div>
  </div>
  <div class="vs">VS</div>
  <div class="card-choice" id="choice2" onclick="pick(2)">
    <div class="mystery">❓</div>
    <div class="name">لاعب غامض</div>
    <div style="color:#aaa;font-size:12px" id="pos2"></div>
  </div>
</div>

<div class="field">
  <div class="team"><h3 class="p1">فريقك <span id="score1"></span></h3><div id="t1"></div></div>
  <div class="team"><h3 class="p2">فريق AI <span id="score2"></span></h3><div id="t2"></div></div>
</div>

<div class="loading" id="loading">
  <div class="ball"></div>
  <div id="result">الذكاء الاصطناعي بيحلل الفرق...</div>
  <div class="score" id="finalScore"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const myName = urlParams.get('name') || 'انت';
document.getElementById('myName').innerText = myName

const firebaseConfig = {
  apiKey: "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",
  authDomain: "mazad-noogom.firebaseapp.com",
  databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com",
  projectId: "mazad-noogom",
  storageBucket: "mazad-noogom.firebasestorage.app",
  messagingSenderId: "183884985831",
  appId: "1:183884985831:web:db231949dace2b0798b942"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const positions = ["GK","LB","CB","CB","RB","CM","CM","CM","LW","ST","RW"];
const posNames = ["GK","LB","CB1","CB2","RB","CM1","CM2","CM3","LW","ST","RW"];

let currentPos = 0;
let t1 = Array(11).fill(null), t2 = Array(11).fill(null);
let t1Rating = Array(11).fill(0), t2Rating = Array(11).fill(0);
let usedPlayers = new Set();
let myOptions = [];
let aiOptions = [];
let myPicked = false;
let aiPicked = false;

// كل لاعب معاه الريتنج بتاعه
const playersDB = {
GK: [{n:"نوير",r:91},{n:"بوفون",r:90},{n:"اوبلاك",r:90},{n:"ايديرسون",r:89},{n:"ميندي",r:88},{n:"دونا روما",r:89},{n:"كورتوا",r:90},{n:"اليسون",r:89},{n:"تير شتيجن",r:89},{n:"كاسبر شمايكل",r:84},
     {n:"كاسياس",r:91},{n:"كان",r:90},{n:"تشيك",r:88},{n:"فالديس",r:87},{n:"سيزار",r:88},{n:"نافاس",r:88},{n:"هاندانوفيتش",r:87},{n:"لينو",r:85},{n:"ريا",r:84},{n:"رامسديل",r:83}],
LB: [{n:"روبرتسون",r:88},{n:"تشيلويل",r:86},{n:"تيو هيرنانديز",r:87},{n:"ديفيز",r:87},{n:"شو",r:85},{n:"جريمالدو",r:86},{n:"نونو مينديز",r:85},{n:"اكونا",r:84},{n:"كول",r:90},{n:"اسلي كول",r:88},
     {n:"لافين",r:83},{n:"بال",r:84},{n:"كريس",r:82},{n:"كوتينيو",r:83},{n:"جوسينس",r:84},{n:"ميندي مدريد",r:85},{n:"ريجيولون",r:83},{n:"تيلس",r:82},{n:"ديجن",r:81},{n:"زيميرمان",r:80}],
CB: [{n:"فان دايك",r:90},{n:"روبن دياز",r:89},{n:"راموس",r:90},{n:"ماركينيوس",r:88},{n:"ساليبا",r:87},{n:"اكانجي",r:86},{n:"كيمينجي",r:87},{n:"سيلفا",r:89},{n:"فاران",r:88},{n:"بويول",r:90},
     {n:"نيستا",r:91},{n:"ستام",r:90},{n:"تورام",r:89},{n:"كانافارو",r:91},{n:"لوسيو",r:88},{n:"بيكيه",r:88},{n:"باستوني",r:87},{n:"روديجر",r:87},{n:"كوليبالي",r:87},{n:"دي ليخت",r:87},
     {n:"مالديني",r:92},{n:"هيوملز",r:87},{n:"الابا",r:86},{n:"كيم",r:86},{n:"جابرييل",r:85},{n:"كوناتي",r:85},{n:"روميرو",r:85},{n:"تومياسو",r:84},{n:"جفارديول",r:86},{n:"ماجواير",r:83},
     {n:"ساليبا2",r:87},{n:"دياز2",r:89},{n:"راموس2",r:90},{n:"ماركينيوس2",r:88},{n:"فاران2",r:88}],
RB: [{n:"ارنولد",r:89},{n:"اشرف حكيمي",r:88},{n:"كانسيلو",r:88},{n:"ريس جيمس",r:87},{n:"والكر",r:87},{n:"كوندي",r:86},{n:"دانيلو",r:85},{n:"تريبير",r:85},{n:"دومفريس",r:85},{n:"كافو",r:91},
     {n:"داني الفيس",r:90},{n:"مايكون",r:88},{n:"سانيتي",r:89},{n:"لاين",r:84},{n:"اريكسون",r:83},{n:"كاراخال",r:86},{n:"ازبيليكويتا",r:85},{n:"فريد",r:84},{n:"مزراوي",r:84},{n:"بافارد",r:84}],
CM: [{n:"مودريتش",r:90},{n:"دي بروين",r:91},{n:"كروس",r:90},{n:"فالفيردي",r:88},{n:"بيلينجهام",r:90},{n:"برونو",r:88},{n:"باريلا",r:87},{n:"تشواميني",r:87},{n:"رايس",r:87},{n:"كامافينجا",r:86},
     {n:"زيدان",r:92},{n:"بيرلو",r:91},{n:"جيرارد",r:90},{n:"لامبارد",r:90},{n:"سكولز",r:90},{n:"فييرا",r:89},{n:"ماتيوس",r:91},{n:"نيدفيد",r:90},{n:"ديفيدز",r:88},{n:"رودري",r:89},
     {n:"بوجبا",r:88},{n:"كاسيميرو",r:88},{n:"جوندوجان",r:87},{n:"برناردو",r:88},{n:"فودين",r:87},{n:"جافي",r:85},{n:"بيدري",r:87},{n:"كامافينجا2",r:86},{n:"رايس2",r:87},{n:"تشواميني2",r:87},
     {n:"مودريتش2",r:90},{n:"دي بروين2",r:91},{n:"كروس2",r:90}],
LW: [{n:"صلاح",r:90},{n:"فينيسيوس",r:90},{n:"راشفورد",r:87},{n:"ساكا",r:88},{n:"دياز",r:87},{n:"نيمار",r:91},{n:"جرينليش",r:87},{n:"سون",r:88},{n:"كومان",r:86},{n:"ماني",r:88},
     {n:"رونالدو",r:92},{n:"هنري",r:91},{n:"ريبيري",r:90},{n:"روبين",r:90},{n:"جيجز",r:89},{n:"اوفرمارس",r:87},{n:"سافيو",r:86},{n:"نيمار اسطورة",r:91},{n:"ستيرلينج",r:87},{n:"راشفورد اسطورة",r:87}],
ST: [{n:"هالاند",r:91},{n:"ليفاندوفسكي",r:90},{n:"مارتينيز",r:88},{n:"اوسيمين",r:88},{n:"كين",r:89},{n:"جريزمان",r:87},{n:"رونالدو البرازيلي",r:92},{n:"ايتو",r:89},{n:"دراجبا",r:88},{n:"اجويرو",r:89},
     {n:"سوارز",r:90},{n:"زلاتان",r:89},{n:"توريس",r:88},{n:"بيليه",r:93},{n:"روماريو",r:91},{n:"فان باستن",r:91},{n:"باتيستوتا",r:88},{n:"كريسبو",r:87},{n:"انزاجي",r:87},{n:"شيفشينكو",r:88}],
RW: [{n:"مبابي",r:91},{n:"ديمبلي",r:87},{n:"ساني",r:87},{n:"سترلينج",r:87},{n:"بيل",r:89},{n:"فرانك",r:86},{n:"ميسي اسطورة",r:93},{n:"رونالدو اسطورة",r:92},{n:"فيجو اسطورة",r:90},{n:"بيليه اسطورة",r:93},
     {n:"جارينشا",r:91},{n:"روبين اسطورة",r:90},{n:"ريبيري اسطورة",r:90},{n:"ناني",r:85},{n:"كوادرادو",r:85},{n:"برناردو",r:88},{n:"ساكا اسطورة",r:88},{n:"محرز اسطورة",r:87},{n:"دياز اسطورة",r:87},{n:"جرينليش اسطورة",r:87}]
};

function getRandomPlayer(pos){
  let data = [...playersDB[pos]];
  let available = data.filter(p=>!usedPlayers.has(p.n));
  if(available.length < 4){
    playersDB[pos].forEach(p=>usedPlayers.delete(p.n));
    available = [...playersDB[pos]];
  }

  let selected = [];
  for(let i=0; i<4; i++){
    let p = available[Math.floor(Math.random()*available.length)];
    selected.push(p);
    usedPlayers.add(p.n);
    available = available.filter(x=>x.n!=p.n);
  }
  return selected; // [my1, my2, ai1, ai2]
}

function newRound(){
  myPicked = false; aiPicked = false;
  document.getElementById('myStatus').innerText = '';
  document.getElementById('aiStatus').innerText = '';
  document.getElementById('choiceBox').classList.remove('waiting');
  document.getElementById('turn').innerText = `دورك: اختر لاعب لمركز ${posNames[currentPos]}`;
  document.getElementById('count').innerText = `${currentPos+1} / 11`;

  let actualPos = positions[currentPos];
  let players = getRandomPlayer(actualPos);

  myOptions = [players[0], players[1]];
  aiOptions = [players[2], players[3]];

  document.getElementById('name1').innerText = myOptions[0].n;
  document.getElementById('rate1').innerText = `OVR ${myOptions[0].r}`;
  document.getElementById('pos1').innerText = `مركز: ${posNames[currentPos]}`;
  document.getElementById('pos2').innerText = `مركز: ${posNames[currentPos]}`;

  setTimeout(aiPick, 1500 + Math.random()*1500);
}

function pick(choice){
  if(myPicked) return;
  myPicked = true;
  document.getElementById('choiceBox').classList.add('waiting');
  document.getElementById('myStatus').innerText = '✅ اخترت';

  let myPick = myOptions[choice-1];
  t1[currentPos] = myPick.n;
  t1Rating[currentPos] = myPick.r;

  checkNext();
}

function aiPick(){
  if(aiPicked) return;
  aiPicked = true;
  document.getElementById('aiStatus').innerText = '✅ اختار';

  // AI بيختار الاعلى OVR فير
  let aiPick = aiOptions[0].r > aiOptions[1].r? aiOptions[0] : aiOptions[1];
  t2[currentPos] = aiPick.n;
  t2Rating[currentPos] = aiPick.r;

  checkNext();
}

function checkNext(){
  if(myPicked && aiPicked){
    updateTeams();
    setTimeout(nextPos, 1000);
  }
}

function updateTeams(){
  let total1 = t1Rating.reduce((a,b)=>a+b,0);
  let total2 = t2Rating.reduce((a,b)=>a+b,0);
  document.getElementById('score1').innerText = `OVR: ${total1}`;
  document.getElementById('score2').innerText = `OVR: ${total2}`;

  document.getElementById('t1').innerHTML = '';
  document.getElementById('t2').innerHTML = '';
  t1.forEach((p,i)=>{document.getElementById('t1').innerHTML += `<div class="slot ${p?'filled':''}"><b>${posNames[i]}</b><br>${p?p:'-'} <div class="rating">${t1Rating[i]?t1Rating[i]:''}</div></div>`});
  t2.forEach((p,i)=>{document.getElementById('t2').innerHTML += `<div class="slot ${p?'filled':''}"><b>${posNames[i]}</b><br>${p?p:'-'} <div class="rating">${t2Rating[i]?t2Rating[i]:''}</div></div>`});
}

function nextPos(){
  currentPos++;
  if(currentPos >= 11){
    document.getElementById('loading').style.display = 'flex';
    setTimeout(evaluateWinner, 3000);
    return;
  }
  newRound();
}

function evaluateWinner(){
  let total1 = t1Rating.reduce((a,b)=>a+b,0);
  let total2 = t2Rating.reduce((a,b)=>a+b,0);

  let result = total1 > total2? `🏆 انت كسبت!` :
               total2 > total1? `😭 AI كسب!` :
               `🤝 تعادل!`;

  document.getElementById('result').innerText = result;
  document.getElementById('finalScore').innerText = `فريقك ${total1} OVR vs AI ${total2} OVR`;
}

newRound();
</script>
</body>
</html>
