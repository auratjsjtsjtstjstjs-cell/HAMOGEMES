<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Cairo';color:#fff;min-height:100vh;text-align:center;padding:30px;
  background: linear-gradient(180deg, #1a1a4d 0%, #0f0c29 100%);
}
h1{background:linear-gradient(90deg,#FFD700,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:40px;margin-bottom:20px}
.balance{display:flex;justify-content:space-around;margin:20px 0}
.box{background:rgba(0,0,0,0.6);padding:15px;border-radius:15px;border:2px solid #FFD700;width:45%}
.box span{font-size:28px;font-weight:900;color:#FFD700}
.card{background:rgba(0,0,0,0.6);border-radius:20px;padding:20px;margin:20px auto;max-width:400px;border:2px solid rgba(102,126,234,0.3)}
.btn{width:100%;padding:15px;margin:10px 0;border:none;border-radius:14px;font-weight:900;cursor:pointer;font-size:18px;background:linear-gradient(90deg,#00aaff,#0088ff);color:#fff}
.btn-buy{background:linear-gradient(90deg,#FFD700,#FF8C00);color:#000}
.btn-sell{background:linear-gradient(90deg,#ff4444,#ff0000);color:#fff}
.back{margin-top:30px;padding:12px 25px;background:#444;color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<h1>🛒 المتجر 🛒</h1>

<div class="balance">
  <div class="box">
    <div>رصيدك</div>
    <span id="coins">0</span> <div>عملة</div>
  </div>
  <div class="box">
    <div>رصيدك</div>
    <span id="tickets">0</span> <div>تذكرة</div>
  </div>
</div>

<!-- شراء بالعملة -->
<div class="card">
  <h2>اشتري عملات بالتذاكر</h2>
  <button class="btn btn-buy" onclick="buyCoins(1)">1 تذكرة = 100 عملة</button>
  <button class="btn btn-buy" onclick="buyCoins(10)">10 تذاكر = 1000 عملة</button>
</div>

<!-- بيع العملة -->
<div class="card">
  <h2>بيع عملات وخد تذاكر</h2>
  <button class="btn btn-sell" onclick="sellCoins(100)">100 عملة = 1 تذكرة</button>
  <button class="btn btn-sell" onclick="sellCoins(1000)">1000 عملة = 10 تذاكر</button>
</div>

<button class="back" onclick="location.href='index.html'">رجوع للقائمة</button>

<script>
// تحميل الرصيد
function loadBalance(){
  let coins = localStorage.getItem("العملات") || 0;
  let tickets = localStorage.getItem("التذاكر") || 0;
  document.getElementById("coins").innerText = coins;
  document.getElementById("tickets").innerText = tickets;
}

// شراء عملات
function buyCoins(ticketAmount){
  let tickets = parseInt(localStorage.getItem("التذاكر")) || 0;
  let coins = parseInt(localStorage.getItem("العملات")) || 0;
  let coinAmount = ticketAmount * 100;

  if(tickets >= ticketAmount){
    tickets = tickets - ticketAmount;
    coins = coins + coinAmount;
    localStorage.setItem("التذاكر", tickets);
    localStorage.setItem("العملات", coins);
    alert(`✅ تم! اشتريت ${coinAmount} عملة`);
    loadBalance();
  }else{
    alert("❌ معندكش تذاكر كفاية");
  }
}

// بيع عملات
function sellCoins(coinAmount){
  let tickets = parseInt(localStorage.getItem("التذاكر")) || 0;
  let coins = parseInt(localStorage.getItem("العملات")) || 0;
  let ticketAmount = coinAmount / 100;

  if(coins >= coinAmount){
    coins = coins - coinAmount;
    tickets = tickets + ticketAmount;
    localStorage.setItem("التذاكر", tickets);
    localStorage.setItem("العملات", coins);
    alert(`✅ تم! بعت ${coinAmount} عملة وخدت ${ticketAmount} تذاكر`);
    loadBalance();
  }else{
    alert("❌ معندكش عملات كفاية");
  }
}

window.onload = loadBalance;
</script>

</body>
</html>
