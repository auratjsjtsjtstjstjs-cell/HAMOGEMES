<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCOUNT - GAMES HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        * {margin: 0; padding: 0; box-sizing: border-box;}
        
        body {
            font-family: 'Cairo', sans-serif;
            color: white;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a4d 0%, #0f0c29 100%);
            padding-bottom: 90px;
        }
        
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px 60px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 15px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }
        
        .name-input {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 12px 20px;
            font-size: 22px;
            font-weight: 900;
            color: white;
            text-align: center;
            width: 80%;
            max-width: 300px;
            font-family: 'Cairo';
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        
        .name-input:focus {
            outline: none;
            border-color: #f093fb;
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.5);
            background: rgba(255,255,255,0.25);
        }
        
        .name-input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        
        .save-btn {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            border: none;
            padding: 8px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 900;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: 0.3s;
        }
        .save-btn:hover {transform: scale(1.05);}
        
        .stats-container {
            display: flex;
            justify-content: space-around;
            padding: 25px 15px;
            gap: 10px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 15px 10px;
            text-align: center;
            flex: 1;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        .stat-box:hover {transform: translateY(-5px); border-color: #667eea;}
        
        .stat-number {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {font-size: 12px; color: #aaa; margin-top: 5px;}
        
        .settings-list {
            padding: 0 20px;
            margin-top: 20px;
        }
        
        .setting-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .setting-item:hover {
            background: rgba(102, 126, 234, 0.15);
            border-color: #667eea;
            transform: translateX(-5px);
        }
        
        .setting-icon {font-size: 24px;}
        .setting-text {flex: 1; font-weight: 700;}
        .setting-arrow {color: #667eea; font-size: 20px;}
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #0f0c29; display: flex;
            justify-content: space-around; align-items: center; z-index: 999;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; 
            color: #888; text-decoration: none; font-size: 11px; 
            font-weight: 700; flex: 1;
        }
        .nav-item.active { color: #667eea; }
        .nav-icon { font-size: 28px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar">👑</div>
        <input type="text" class="name-input" id="playerName" placeholder="اكتب اسمك هنا">
        <button class="save-btn" onclick="saveName()">حفظ الاسم</button>
    </div>
    
    <div class="stats-container">
        <div class="stat-box">
            <div class="stat-number" id="points">0</div> <!-- صفرتها -->
            <div class="stat-label">النقاط</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="wins">0</div> <!-- صفرتها -->
            <div class="stat-label">الفوز</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="level">1</div> <!-- خليت المستوى 1 -->
            <div class="stat-label">المستوى</div>
        </div>
    </div>
    
    <div class="settings-list">
        <div class="setting-item">
            <span class="setting-icon">🎮</span>
            <span class="setting-text">العابي</span>
            <span class="setting-arrow">‹</span>
        </div>
        <div class="setting-item">
            <span class="setting-icon">🏆</span>
            <span class="setting-text">الانجازات</span>
            <span class="setting-arrow">‹</span>
        </div>
        <div class="setting-item">
            <span class="setting-icon">⚙️</span>
            <span class="setting-text">الاعدادات</span>
            <span class="setting-arrow">‹</span>
        </div>
        <div class="setting-item">
            <span class="setting-icon">🚪</span>
            <span class="setting-text">تسجيل الخروج</span>
            <span class="setting-arrow">‹</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="nav-icon">🏠</span><span>HOME</span>
        </a>
        <a href="guess.html" class="nav-item">
            <span class="nav-icon">🤔</span><span>التخمين</span>
        </a>
        <a href="ACCOUNT.html" class="nav-item active">
            <span class="nav-icon">👤</span><span>ACCOUNT</span>
        </a>
        <a href="memory.html" class="nav-item">
            <span class="nav-icon">🧠</span><span>الذاكره</span>
        </a>
    </nav>

<script>
function saveName() {
    const name = document.getElementById('playerName').value;
    if(name.trim() !== '') {
        localStorage.setItem('playerName', name);
        alert('تم حفظ الاسم: ' + name + ' 👑');
    }
}

window.onload = function() {
    const savedName = localStorage.getItem('playerName');
    if(savedName) {
        document.getElementById('playerName').value = savedName;
    }
}
</script>

</body>
</html>
