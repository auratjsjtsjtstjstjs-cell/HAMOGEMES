<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Cairo', sans-serif;
            color: white;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a4d 0%, #0f0c29 100%);
            padding-bottom: 80px;
        }
       .ticket-box {
            position: fixed; top: 15px; right: 15px; z-index: 9999;
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            padding: 8px 16px; border-radius: 20px; display: flex;
            align-items: center; gap: 6px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            border: 2px solid white;
        }
       .ticket-box span {color: white;font-weight: 900;font-size: 18px;}
       .slider-container {
            width: 90%; max-width: 500px; margin: 25px auto; position: relative;
            border-radius: 16px; overflow: hidden; background: #000;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.4); margin-top: 80px;
        }
       .slider-wrapper {position: relative;width: 100%;padding-top: 56.25%;}
       .slider {
            position: absolute;top: 0;left: 0;display: flex;
            width: 500%; height: 100%;transition: transform 0.5s ease-in-out;
        }
       .slide {width: 20%;height: 100%;position: relative;cursor: pointer;}
       .slide img {width: 100%;height: 100%;object-fit: cover;}
       .slide-text {
            position: absolute;bottom: 0;left: 0;right: 0;padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-size: 18px;font-weight: 900;text-align: center;text-shadow: 0 0 10px #667eea;
        }
       .lock-overlay {
            position: absolute;top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);display: flex;align-items: center;
            justify-content: center;flex-direction: column;gap: 10px;
        }
       .lock-icon {font-size: 50px;filter: drop-shadow(0 0 10px gold);}
       .lock-text {font-size: 16px;color: gold;font-weight: 900;}
       .arrow {
            position: absolute;top: 50%;transform: translateY(-50%);
            background: rgba(0,0,0,0.4);color: white;border: none;font-size: 35px;
            cursor: pointer;z-index: 10;padding: 5px 12px;border-radius: 50%;
        }
       .prev { right: 10px; }.next { left: 10px; }
       .arrow:hover { background: rgba(102,126,234,0.8); }
       .dots {
            position: absolute;bottom: 55px;left: 50%;transform: translateX(-50%);
            display: flex;gap: 8px;
        }
       .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.3s; cursor: pointer; }
       .dot.active { background: #667eea; width: 20px; border-radius: 10px; }
       .section-title {
            text-align: center;font-size: 26px;font-weight: 900;margin: 20px 0;
            background: linear-gradient(90deg, #667eea, #f093fb);
            -webkit-background-clip: text;-webkit-text-fill-color: transparent;
        }
       .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #0f0c29; display: flex;
            justify-content: space-around; align-items: center; z-index: 999;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }
       .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #888; text-decoration: none; font-size: 11px;
            font-weight: 700; flex: 1;
        }
       .nav-item.active { color: #667eea; }
       .nav-icon { font-size: 28px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="ticket-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M2 9C2 8.44772 2.44772 8 3 8H5C5.55228 8 6 8.44772 6 9V9C6 9.55228 5.55228 10 5 10H3C2.44772 10 2 9.55228 2 9V9Z" fill="white"/>
        <path d="M18 9C18 8.44772 18.4477 8 19 8H21C21.5523 8 22 8.44772 22 9V9C22 9.55228 21.5523 10 21 10H19C18.4477 10 18 9.55228 18 9V9Z" fill="white"/>
        <path d="M3 8H21V16H3V8Z" stroke="white" stroke-width="2"/>
        <path d="M8 12H16" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="عداد_التذاكر">0</span>
      <span>تذكرة</span>
    </div>

    <div class="slider-container">
        <div class="slider-wrapper">
            <div class="slider" id="slider">
                <div class="slide"><img src="https://i.postimg.cc/hXqHznHm/image.jpg"><div class="slide-text">PRIME OR FAKE</div></div>
                <div class="slide" onclick="window.location.href='dealloby.html'"><img src="https://i.postimg.cc/0zqLMvLm/image.jpg"><div class="slide-text">DEAL OR NO DEAL</div></div>
                <div class="slide" onclick="window.location.href='mazadpromax.html'"><img src="https://i.postimg.cc/NKwW9tWy/image.jpg"><div class="slide-text">المزاد الذهبي</div></div>
                <div class="slide" onclick="window.location.href='mazadloby.html'"><img src="https://i.postimg.cc/K1ydkbdg/image.jpg"><div class="slide-text">مزاد عادي</div></div>
                <div class="slide" onclick="alert('🔒 السومبيرو مقفلة حاليا\nارجع قريب')">
                    <img src="https://i.postimg.cc/cKDpgVHh/image.png">
                    <div class="slide-text">السومبيرو</div>
                    <div class="lock-overlay"><div class="lock-icon">🔒</div><div class="lock-text">قريباً</div></div>
                </div>
            </div>
            <button class="arrow prev" onclick="moveSlide(-1)">›</button>
            <button class="arrow next" onclick="moveSlide(1)">‹</button>
            <div class="dots" id="dots"></div>
        </div>
    </div>

    <div class="section-title">العابنا المميزة</div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active"><span class="nav-icon">🏠</span><span>HOME</span></a>
        <a href="shop.html" class="nav-item"><span class="nav-icon">🛒</span><span>SHOP</span></a>
        <a href="ACCOUNT.html" class="nav-item"><span class="nav-icon">👤</span><span>ACCOUNT</span></a>
        <a href="memory.html" class="nav-item"><span class="nav-icon">🧠</span><span>الذاكره</span></a>
    </nav>

<script>
let currentSlide = 0;
const slider = document.getElementById('slider');
const totalSlides = 5;
const dotsContainer = document.getElementById('dots');

for(let i = 0; i < totalSlides; i++) {
    dotsContainer.innerHTML += `<div class="dot" onclick="goToSlide(${i})"></div>`;
}
updateDots();

function moveSlide(n) {
    currentSlide += n;
    if(currentSlide < 0) currentSlide = totalSlides - 1;
    if(currentSlide >= totalSlides) currentSlide = 0;
    slider.style.transform = `translateX(-${currentSlide * 20}%)`;
    updateDots();
}
function goToSlide(n){ currentSlide = n; slider.style.transform = `translateX(-${currentSlide * 20}%)`; updateDots(); }
function updateDots() {
    document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
    });
}
setInterval(() => { moveSlide(1); }, 4000);

window.onload = function(){
    let التذاكر = localStorage.getItem("التذاكر") || 0;
    document.getElementById("عداد_التذاكر").innerText = التذاكر;
}
</script>

</body>
</html>
