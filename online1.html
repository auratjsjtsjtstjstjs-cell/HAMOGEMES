<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم - الملعب 100 لاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
body{background:url('https://i.postimg.cc/06F7XXzk/bg.jpg') center/cover no-repeat fixed;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:10px}
.stats{display:flex;justify-content:space-around;background:rgba(17,17,17,0.9);padding:10px;border-radius:10px;margin-bottom:10px}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:#ffd700;color:#000;padding:8px;border-radius:8px;font-weight:bold;margin:10px;font-weight:700}
.field-container{display:flex;justify-content:space-around;gap:10px;margin-top:15px}
.pitch{width:48%;height:500px;background:linear-gradient(#0a5c36,#0a5c36);border:3px solid #fff;border-radius:10px;position:relative;overflow:hidden}
.pitch::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:#fff}
.pitch::after{content:'';position:absolute;top:50%;left:50%;width:100px;height:100px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.team-title{padding:8px;font-weight:900;font-size:18px}
.team-title.blue{background:#00aaff;color:#000}
.team-title.red{background:#ff4444;color:#fff}
.player-spot{position:absolute;width:70px;text-align:center;transform:translate(-50%,-50%)}
.player-spot img{width:50px;height:50px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#000}
.player-spot.name{font-size:10px;font-weight:700;margin-top:3px;text-shadow:1px 1px 2px #000}
.player-spot.empty img{opacity:0.3;border-style:dashed}
.pos-GK{bottom:5%;left:50%}
.pos-LB{bottom:25%;left:15%}
.pos-CB1{bottom:25%;left:35%}
.pos-CB2{bottom:25%;left:65%}
.pos-RB{bottom:25%;left:85%}
.pos-CM1{bottom:50%;left:30%}
.pos-CM2{bottom:50%;left:70%}
.pos-CAM{bottom:65%;left:50%}
.pos-LW{bottom:80%;left:20%}
.pos-ST{bottom:80%;left:50%}
.pos-RW{bottom:80%;left:80%}
.card{border:3px solid #ffd700;border-radius:15px;padding:15px;width:340px;margin:15px auto;background:rgba(17,17,17,0.95)}
.card img{width:100px;height:100px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;margin-bottom:10px}
.pos{color:#aaa;font-size:14px;font-weight:400}
.name{font-size:22px;color:#ffd700;margin:5px;font-weight:900}
.price{font-size:18px;color:#0f0;font-weight:700}
input{width:130px;padding:8px;border-radius:8px;border:2px solid #ffd700;background:#222;color:#fff;text-align:center;font-family:'Cairo'}
button{padding:10px 15px;margin:4px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:16px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.5;cursor:not-allowed}
#loading{ position:fixed;top:0;left:0;width:100%;height:100%; background:radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%); display:none;justify-content:center; align-items:center;flex-direction:column;z-index:999; }
.ball{ width:120px;height:120px;border-radius:50%; background:conic-gradient(from 0deg, #fff 0deg 45deg, #000 45deg 90deg, #fff 90deg 135deg, #000 135deg 180deg, #fff 180deg 225deg, #000 225deg 270deg, #fff 270deg 315deg, #000 315deg 360deg); animation:spin 1.5s linear infinite; box-shadow:0 0 40px #ffd700, 0 0 80px #ffd700; border:4px solid #ffd700; }
@keyframes spin{100%{transform:rotate(360deg)}}
#aiText{margin-top:30px;font-size:28px;color:#ffd700;font-weight:900;text-shadow:0 0 10px #ffd700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.result-box{ background:#111;border:2px solid #ffd700;border-radius:20px; padding:25px;margin-top:20px;width:80%;max-width:400px }
#timerScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:998;display:none;flex-direction:column;justify-content:center;align-items:center}
.timerNum{font-size:120px;color:#ffd700;font-weight:900;animation:pulse 1s infinite}
.timerText{font-size:30px;margin-top:20px}
</style>
</head>
<body>

<h1>⚽ مزاد النجوم - 100 لاعب ⚽</h1>
<div class="stats"><div class="p1"><span id="name1">انت</span>: <span id="m1">200,000,000</span>$</div><div id="count">1 / 11</div><div class="p2"><span id="name2">الخصم</span>: <span id="m2">200,000,000</span>$</div></div>
<div class="turn" id="turn">دور المزايدة:...</div>

<div class="field-container">
  <div>
    <div class="team-title blue" id="team1Title">الفريق الازرق</div>
    <div class="pitch" id="pitch1"></div>
  </div>
  <div>
    <div class="team-title red" id="team2Title">الفريق الاحمر</div>
    <div class="pitch" id="pitch2"></div>
  </div>
</div>

<div class="card">
  <img id="playerImg" src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
  <div class="pos" id="pos"></div>
  <div class="name" id="name"></div>
  <div class="price" id="price"></div>
  <input id="bidInput" type="number" placeholder="اكتب المزايدة"><br>
  <button class="bid" id="bidBtn" onclick="bid()">مزايدة</button>
  <button class="take" id="takeBtn" onclick="take()">خده</button>
  <button class="skip" onclick="skip()">تخطي</button>
</div>

<div id="loading">
  <div class="ball"></div>
  <div id="aiText">جاري التحليل النهائي</div>
  <div class="result-box" id="resultBox" style="display:none;"></div>
</div>

<div id="timerScreen">
  <div class="timerNum" id="timerNum">3</div>
  <div class="timerText">المركز القادم: <span id="nextPos"></span></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",
  authDomain: "mazad-noogom.firebaseapp.com",
  databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com",
  projectId: "mazad-noogom",
  storageBucket: "mazad-noogom.firebasestorage.app",
  messagingSenderId: "183884985831",
  appId: "1:183884985831:web:db231949dace2b0798b942"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);
const room = urlParams.get('room');
const type = urlParams.get('type') || 'pro';
const myName = urlParams.get('name');
const amIHost = urlParams.get('player') == '1';
let myPlayer = amIHost? 1 : 2;

const positions = ["GK","LB","CB1","CB2","RB","CM1","CM2","CAM","LW","ST","RW"];
const PRICE = 1000000;
const playerImageCache = {};

// 100 لاعب مقسمين
const playersDB = {
GK: [
{n:"Thibaut Courtois", p:PRICE}, {n:"Alisson", p:PRICE}, {n:"Marc-Andre ter Stegen", p:PRICE}, {n:"Gianluigi Donnarumma", p:PRICE}, {n:"Jan Oblak", p:PRICE},
{n:"Manuel Neuer", p:PRICE}, {n:"Ederson", p:PRICE}, {n:"Emiliano Martinez", p:PRICE}, {n:"Mike Maignan", p:PRICE}, {n:"David Raya", p:PRICE}
],
LB: [
{n:"Alphonso Davies", p:PRICE}, {n:"Andrew Robertson", p:PRICE}, {n:"Theo Hernandez", p:PRICE}, {n:"Joao Cancelo", p:PRICE}, {n:"Nuno Mendes", p:PRICE},
{n:"Luke Shaw", p:PRICE}, {n:"Ben Chilwell", p:PRICE}, {n:"Federico Dimarco", p:PRICE}, {n:"Pervis Estupinan", p:PRICE}, {n:"Alejandro Balde", p:PRICE}
],
CB1: [
{n:"Virgil van Dijk", p:PRICE}, {n:"Ruben Dias", p:PRICE}, {n:"Antonio Rudiger", p:PRICE}, {n:"William Saliba", p:PRICE}, {n:"Eder Militao", p:PRICE},
{n:"Ronald Araujo", p:PRICE}, {n:"Marquinhos", p:PRICE}, {n:"Josko Gvardiol", p:PRICE}, {n:"Gabriel Magalhaes", p:PRICE}, {n:"Alessandro Bastoni", p:PRICE}
],
CB2: [
{n:"Kim Min-jae", p:PRICE}, {n:"Ibrahima Konate", p:PRICE}, {n:"Cristian Romero", p:PRICE}, {n:"Matthijs de Ligt", p:PRICE}, {n:"Levi Colwill", p:PRICE},
{n:"Piero Hincapie", p:PRICE}, {n:"Gleison Bremer", p:PRICE}, {n:"Micky van de Ven", p:PRICE}, {n:"Pau Torres", p:PRICE}, {n:"Marc Guehi", p:PRICE}
],
RB: [
{n:"Achraf Hakimi", p:PRICE}, {n:"Trent Alexander-Arnold", p:PRICE}, {n:"Kyle Walker", p:PRICE}, {n:"Reece James", p:PRICE}, {n:"Jeremie Frimpong", p:PRICE},
{n:"Benjamin Pavard", p:PRICE}, {n:"Kieran Trippier", p:PRICE}, {n:"Denzel Dumfries", p:PRICE}, {n:"Diogo Dalot", p:PRICE}, {n:"Pedro Porro", p:PRICE}
],
CM1: [
{n:"Rodri", p:PRICE}, {n:"Federico Valverde", p:PRICE}, {n:"Toni Kroos", p:PRICE}, {n:"Declan Rice", p:PRICE}, {n:"Joshua Kimmich", p:PRICE},
{n:"Martin Odegaard", p:PRICE}, {n:"Casemiro", p:PRICE}, {n:"Eduardo Camavinga", p:PRICE}, {n:"Aurelien Tchouameni", p:PRICE}, {n:"Nicolo Barella", p:PRICE}
],
CM2: [
{n:"Luka Modric", p:PRICE}, {n:"Ilkay Gundogan", p:PRICE}, {n:"Bruno Guimaraes", p:PRICE}, {n:"Moises Caicedo", p:PRICE}, {n:"Enzo Fernandez", p:PRICE},
{n:"Zubimendi", p:PRICE}, {n:"Sandro Tonali", p:PRICE}, {n:"Manuel Locatelli", p:PRICE}, {n:"Ryan Gravenberch", p:PRICE}, {n:"Mason Mount", p:PRICE}
],
CAM: [
{n:"Kevin De Bruyne", p:PRICE}, {n:"Jude Bellingham", p:PRICE}, {n:"Lionel Messi", p:PRICE}, {n:"Bruno Fernandes", p:PRICE}, {n:"Bernardo Silva", p:PRICE},
{n:"Florian Wirtz", p:PRICE}, {n:"Jamal Musiala", p:PRICE}, {n:"Antoine Griezmann", p:PRICE}, {n:"James Maddison", p:PRICE}, {n:"Kai Havertz", p:PRICE}
],
LW: [
{n:"Neymar", p:PRICE}, {n:"Rafael Leao", p:PRICE}, {n:"Vinicius Junior", p:PRICE}, {n:"Leroy Sane", p:PRICE}, {n:"Marcus Rashford", p:PRICE},
{n:"Kingsley Coman", p:PRICE}, {n:"Raheem Sterling", p:PRICE}, {n:"Luis Diaz", p:PRICE}, {n:"Gabriel Martinelli", p:PRICE}, {n:"Barcola", p:PRICE}
],
ST: [
{n:"Erling Haaland", p:PRICE}, {n:"Kylian Mbappe", p:PRICE}, {n:"Robert Lewandowski", p:PRICE}, {n:"Harry Kane", p:PRICE}, {n:"Lautaro Martinez", p:PRICE},
{n:"Victor Osimhen", p:PRICE}, {n:"Darwin Nunez", p:PRICE}, {n:"Gabriel Jesus", p:PRICE}, {n:"Dusan Vlahovic", p:PRICE}, {n:"Alexander Isak", p:PRICE}
],
RW: [
{n:"Mohamed Salah", p:PRICE}, {n:"Bukayo Saka", p:PRICE}, {n:"Riyad Mahrez", p:PRICE}, {n:"Rodrygo", p:PRICE}, {n:"Phil Foden", p:PRICE},
{n:"Ousmane Dembele", p:PRICE}, {n:"Jarrod Bowen", p:PRICE}, {n:"Pedro Neto", p:PRICE}, {n:"Jack Grealish", p:PRICE}, {n:"Antony", p:PRICE}
]
};

let currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let turn=1, m1=200000000, m2=200000000, starter=1;
let t1={}, t2={};
let filled1={}, filled2={};
let whoPassed=0, timerRunning=false;

function drawPitch(){
  positions.forEach(pos=>{
    document.getElementById('pitch1').innerHTML += `<div class="player-spot pos-${pos} empty" id="p1-${pos}"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"><div class="name">${pos}</div></div>`;
    document.getElementById('pitch2').innerHTML += `<div class="player-spot pos-${pos} empty" id="p2-${pos}"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"><div class="name">${pos}</div></div>`;
  })
}
drawPitch();

const roomRef = db.ref('rooms/' + type + '/' + room);

roomRef.on('value', async (snapshot) => {
  let data = snapshot.val()
  if(!data) return;
  document.getElementById('name1').innerText = data.player1?.name || 'الازرق';
  document.getElementById('name2').innerText = data.player2?.name || 'الاحمر';
  document.getElementById('team1Title').innerText = data.player1?.name || 'الفريق الازرق';
  document.getElementById('team2Title').innerText = data.player2?.name || 'الفريق الاحمر';
  await loadData(data);
})

async function getPlayerImage(name){
  if(playerImageCache[name]) return playerImageCache[name];
  try{
    let res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(name)}`);
    let data = await res.json();
    let img = data.players?.[0]?.strThumb || "https://cdn-icons-png.flaticon.com/512/1077/1077114.png";
    playerImageCache[name] = img;
    return img;
  }catch{
    return "https://cdn-icons-png.flaticon.com/512/1077/1077114.png";
  }
}

async function loadData(data){
  currentPosIndex=data.currentPos||0;
  currentBid=data.currentBid||0;
  highestBidder=data.highestBidder||0;
  turn=data.turn||1;
  starter=data.starter||1;
  whoPassed=data.whoPassed||0;
  m1=data.m1 || 200000000;
  m2=data.m2 || 200000000;
  t1=data.t1 || {};
  t2=data.t2 || {};
  currentPlayer=data.currentPlayer || null;
  filled1=data.filled1 || {};
  filled2=data.filled2 || {};

  let currentPos = positions[currentPosIndex];
  if(filled1[currentPos] && filled2[currentPos] && currentPosIndex < 10 && amIHost &&!timerRunning){
    timerRunning=true;
    startTimer();
    return;
  }

  if(currentPosIndex >= 11 && amIHost){
    document.getElementById('loading').style.display = 'flex';
    setTimeout(evaluateGame, 3000);
    return;
  }

  if(!currentPlayer &&!filled1[currentPos] &&!filled2[currentPos] && amIHost) newPlayer();

  await updatePitch();
  show();
}

function startTimer(){
  let count=3;
  let nextPosName = positions[currentPosIndex + 1];
  document.getElementById('timerScreen').style.display='flex';
  document.getElementById('nextPos').innerText=nextPosName;
  document.getElementById('timerNum').innerText=count;
  let interval = setInterval(()=>{
    count--;
    document.getElementById('timerNum').innerText=count;
    if(count<=0){
      clearInterval(interval);
      document.getElementById('timerScreen').style.display='none';
      let nextStarter = starter==1? 2 : 1;
      roomRef.update({currentPos: currentPosIndex + 1, starter: nextStarter, turn: nextStarter, whoPassed:0}).then(()=>{timerRunning=false});
    }
  },1000);
}

function getRandomPlayer(pos){
  let data = playersDB[pos];
  return data[Math.floor(Math.random()*data.length)];
}

function newPlayer(){
  let posName=positions[currentPosIndex];
  let p = getRandomPlayer(posName);
  roomRef.update({ currentBid: p.p, currentPlayer: p })
}

async function show(){
  if(!currentPlayer) return;
  document.getElementById('pos').innerText="المركز: " + positions[currentPosIndex];
  document.getElementById('name').innerText=currentPlayer.n;
  let img = await getPlayerImage(currentPlayer.n);
  document.getElementById('playerImg').src = img;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+1000000;
  let myTurn = turn==myPlayer;
  document.getElementById('bidBtn').disabled =!myTurn;
  document.getElementById('takeBtn').disabled =!myTurn;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?document.getElementById('name1').innerText:document.getElementById('name2').innerText) + (myTurn?" - دورك":"");
}

function bid(){
  if(turn!=myPlayer) return;
  let val=parseInt(document.getElementById('bidInput').value);
  let money=myPlayer==1?m1:m2;
  if(isNaN(val)){alert("اكتب رقم");return}
  if(val<=currentBid){alert("لازم تعلي");return}
  if(val>money){alert("مفيش فلوس");return}
  roomRef.update({currentBid:val, highestBidder:myPlayer, turn:myPlayer==1?2:1});
}

function take(){
  if(turn!=myPlayer) return;
  let receiver = myPlayer==1? 2 : 1;
  let taker = myPlayer;
  let takenPlayer = currentPlayer;
  let pos = positions[currentPosIndex];
  let updates={};
  if(receiver==1){
    updates["m1"]=m1-currentBid;
    updates["t1/"+pos]=takenPlayer;
    updates["filled1/"+pos]=true;
  } else {
    updates["m2"]=m2-currentBid;
    updates["t2/"+pos]=takenPlayer;
    updates["filled2/"+pos]=true;
  }
  updates["currentPlayer"]=null;
  updates["currentBid"]=0;
  updates["highestBidder"]=0;
  updates["turn"]=taker;
  updates["whoPassed"]=0;
  roomRef.update(updates).then(()=>{
    if(amIHost && myPlayer==taker) setTimeout(newPlayer,500);
  });
}

function skip(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];
  let updates={};
  if(whoPassed==0){
    updates["whoPassed"]=myPlayer;
    updates["turn"]=myPlayer==1?2:1;
  } else if(whoPassed!=myPlayer){
    updates["filled1/"+pos]=true;
    updates["filled2/"+pos]=true;
    updates["whoPassed"]=0;
    updates["currentPlayer"]=null;
  }
  roomRef.update(updates);
}

async function updatePitch(){
  document.getElementById('m1').innerText=m1.toLocaleString();
  document.getElementById('m2').innerText=m2.toLocaleString();
  document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  for(let pos of positions){
    if(t1[pos]){
      let img = await getPlayerImage(t1[pos].n);
      document.getElementById('p1-'+pos).innerHTML=`<img src="${img}"><div class="name">${t1[pos].n.split(' ')[0]}</div>`;
      document.getElementById('p1-'+pos).classList.remove('empty');
    }
    if(t2[pos]){
      let img = await getPlayerImage(t2[pos].n);
      document.getElementById('p2-'+pos).innerHTML=`<img src="${img}"><div class="name">${t2[pos].n.split(' ')[0]}</div>`;
      document.getElementById('p2-'+pos).classList.remove('empty');
    }
  }
}

async function evaluateGame(){
  let score1 = Object.values(t1).reduce((a,b)=>a+b.p,0);
  let score2 = Object.values(t2).reduce((a,b)=>a+b.p,0);
  let winnerText = score1 > score2? "🏆 الفائز: "+document.getElementById('name1').innerText : score2 > score1? "🏆 الفائز: "+document.getElementById('name2').innerText : "🤝 تعادل";
  let winnerColor = score1 > score2? "lime" : score2 > score1? "#ff4444" : "#ffd700";
  document.getElementById('aiText').innerText = "اكتمل التحليل";
  document.getElementById('resultBox').style.display = "block";
  document.getElementById('resultBox').innerHTML = `
    <div style="font-size:24px;font-weight:900;color:${winnerColor};margin-bottom:15px">${winnerText}</div>
    <div style="display:flex;justify-content:space-between;margin:10px 0"><span>${document.getElementById('name1').innerText}:</span><span style="color:#00aaff;font-weight:700">${(score1/1000000).toFixed(1)} مليون</span></div>
    <div style="display:flex;justify-content:space-between;margin:10px 0"><span>${document.getElementById('name2').innerText}:</span><span style="color:#ff4444;font-weight:700">${(score2/1000000).toFixed(1)} مليون</span></div>
    <button onclick="window.location.href='home.html'" style="margin-top:20px;width:100%;background:#ffd700;color:#000">🔄 العودة للرئيسية</button>`;
}
</script>
</body>
</html>
