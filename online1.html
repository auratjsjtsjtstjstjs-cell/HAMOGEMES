<style>
body{background:url('https://i.postimg.cc/06F7XXzk/bg.jpg') center/cover no-repeat fixed;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:10px}
.stats{display:flex;justify-content:space-around;background:rgba(17,17,17,0.9);padding:10px;border-radius:10px;margin-bottom:10px}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:#ffd700;color:#000;padding:8px;border-radius:8px;font-weight:bold;margin:10px;font-weight:700}
.field-container{display:flex;justify-content:center;gap:25px;margin-top:40px;flex-wrap:wrap}
.pitch{width:380px;height:520px;background:linear-gradient(#0a5c36,#0a5c36);border:3px solid #fff;border-radius:10px;position:relative;overflow:hidden;margin-top:10px}
.pitch::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:#fff}
.pitch::after{content:'';position:absolute;top:50%;left:50%;width:90px;height:90px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.team-title{padding:8px;font-weight:900;font-size:17px;border-radius:8px 8px 0 0;margin-bottom:5px}
.team-title.blue{background:#00aaff;color:#000}
.team-title.red{background:#ff4444;color:#fff}
.player-spot{position:absolute;width:80px;text-align:center;transform:translate(-50%,-50%)}
.player-spot img{width:52px;height:52px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222}
.player-spot.name{font-size:10px;font-weight:700;margin-top:2px;text-shadow:1px 1px 3px #000;white-space:nowrap}
.player-spot.pos-label{font-size:9px;color:#ffd700;font-weight:900}
.player-spot.empty img{opacity:0.2;border:2px dashed #888}

/* التشكيل 4-3-3 */
.pos-GK{bottom:5%;left:50%}
.pos-LB{bottom:20%;left:15%}
.pos-CB1{bottom:20%;left:37%}
.pos-CB2{bottom:20%;left:63%}
.pos-RB{bottom:20%;left:85%}
.pos-CM1{bottom:42%;left:28%}
.pos-CM2{bottom:42%;left:72%}
.pos-CAM{bottom:55%;left:50%}
.pos-LW{bottom:70%;left:16%}
.pos-ST{bottom:75%;left:50%}
.pos-RW{bottom:70%;left:84%}

.card{border:3px solid #ffd700;border-radius:15px;padding:15px;width:360px;margin:15px auto;background:rgba(17,17,17,0.95)}
.card img{width:110px;height:110px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;margin-bottom:10px}
.pos{color:#aaa;font-size:14px;font-weight:400}
.name{font-size:24px;color:#ffd700;margin:5px;font-weight:900}
.price{font-size:18px;color:#0f0;font-weight:700}
input{width:140px;padding:8px;border-radius:8px;border:2px solid #ffd700;background:#222;color:#fff;text-align:center;font-family:'Cairo'}
button{padding:10px 15px;margin:4px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:16px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>

<div class="stats"><div class="p1"><span id="name1">انت</span>: <span id="m1">200,000,000</span>$</div><div id="count">1 / 11</div><div class="p2"><span id="name2">الخصم</span>: <span id="m2">200,000,000</span>$</div></div>

let currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let turn=1, m1=200000000, m2=200000000, starter=1;
let t1={}, t2={};
let filled1={}, filled2={};
let whoPassed=0, timerRunning=false;

function drawPitch(){
  positions.forEach(pos=>{
    document.getElementById('pitch1').innerHTML += `<div class="player-spot pos-${pos} empty" id="p1-${pos}"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1077/1077114.png'"><div class="pos-label">${pos}</div><div class="name">-</div></div>`;
    document.getElementById('pitch2').innerHTML += `<div class="player-spot pos-${pos} empty" id="p2-${pos}"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1077/1077114.png'"><div class="pos-label">${pos}</div><div class="name">-</div></div>`;
  })
}
drawPitch();

const roomRef = db.ref('rooms/' + type + '/' + room);
roomRef.on('value', async (snapshot) => {
  let data = snapshot.val()
  if(!data) return;
  document.getElementById('name1').innerText = data.player1?.name || 'الازرق';
  document.getElementById('name2').innerText = data.player2?.name || 'الاحمر';
  document.getElementById('team1Title').innerText = data.player1?.name || 'الفريق الازرق';
  document.getElementById('team2Title').innerText = data.player2?.name || 'الفريق الاحمر';
  await loadData(data);
})

async function loadData(data){
  currentPosIndex=data.currentPos||0;currentBid=data.currentBid||0;highestBidder=data.highestBidder||0;turn=data.turn||1;starter=data.starter||1;whoPassed=data.whoPassed||0;m1=data.m1 || 200000000;m2=data.m2 || 200000000;t1=data.t1 || {};t2=data.t2 || {};currentPlayer=data.currentPlayer || null;filled1=data.filled1 || {};filled2=data.filled2 || {};
  let currentPos = positions[currentPosIndex];
  if(filled1[currentPos] && filled2[currentPos] && currentPosIndex < 10 && amIHost &&!timerRunning){timerRunning=true;startTimer();return;}
  if(currentPosIndex >= 11 && amIHost){alert("خلص المزاد");return;}
  if(!currentPlayer &&!filled1[currentPos] &&!filled2[currentPos] && amIHost) newPlayer();
  await updatePitch();show();
}

function startTimer(){let count=3;let nextPosName = positions[currentPosIndex + 1];let interval = setInterval(()=>{count--;if(count<=0){clearInterval(interval);let nextStarter = starter==1? 2 : 1;roomRef.update({currentPos: currentPosIndex + 1, starter: nextStarter, turn: nextStarter, whoPassed:0}).then(()=>{timerRunning=false});}},1000);}

function getRandomPlayer(pos){let data = playersDB[pos];return data[Math.floor(Math.random()*data.length)];}
function newPlayer(){let posName=positions[currentPosIndex];let p = getRandomPlayer(posName);roomRef.update({ currentBid: p.p, currentPlayer: p })}

async function show(){
  if(!currentPlayer) return;
  document.getElementById('pos').innerText="المركز: " + positions[currentPosIndex];
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('playerImg').src = currentPlayer.img; // الصورة
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+1000000;
  let myTurn = turn==myPlayer;
  document.getElementById('bidBtn').disabled =!myTurn;
  document.getElementById('takeBtn').disabled =!myTurn;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?document.getElementById('name1').innerText:document.getElementById('name2').innerText) + (myTurn?" - دورك":"");
}

function bid(){if(turn!=myPlayer) return;let val=parseInt(document.getElementById('bidInput').value);let money=myPlayer==1?m1:m2;if(isNaN(val)){alert("اكتب رقم");return}if(val<=currentBid){alert("لازم تعلي");return}if(val>money){alert("مفيش فلوس");return}roomRef.update({currentBid:val, highestBidder:myPlayer, turn:myPlayer==1?2:1});}

function take(){
  if(turn!=myPlayer) return;
  let receiver = myPlayer==1? 2 : 1;let taker = myPlayer;let takenPlayer = currentPlayer;let pos = positions[currentPosIndex];let updates={};
  if(receiver==1){updates["m1"]=m1-currentBid;updates["t1/"+pos]=takenPlayer;updates["filled1/"+pos]=true;}
  else {updates["m2"]=m2-currentBid;updates["t2/"+pos]=takenPlayer;updates["filled2/"+pos]=true;}
  updates["currentPlayer"]=null;updates["currentBid"]=0;updates["highestBidder"]=0;updates["turn"]=taker;updates["whoPassed"]=0;
  roomRef.update(updates).then(()=>{setTimeout(()=>{ if(amIHost) newPlayer(); }, 500);});
}

function skip(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];let updates={};
  if(whoPassed==0){updates["whoPassed"]=myPlayer;updates["turn"]=myPlayer==1?2:1;}
  else if(whoPassed!=myPlayer){updates["filled1/"+pos]=true;updates["filled2/"+pos]=true;updates["whoPassed"]=0;updates["currentPlayer"]=null;}
  roomRef.update(updates).then(()=>{setTimeout(()=>{ if(amIHost) newPlayer(); }, 500);});
}

async function updatePitch(){
  document.getElementById('m1').innerText=m1.toLocaleString();document.getElementById('m2').innerText=m2.toLocaleString();document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  for(let pos of positions){
    if(t1[pos]){
