<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
body{background:url('https://i.postimg.cc/06F7XXzk/bg.jpg') center/cover no-repeat fixed;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:10px}
.stats{display:flex;justify-content:space-around;background:rgba(17,17,17,0.9);padding:10px;border-radius:10px;margin-bottom:10px}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:#ffd700;color:#000;padding:8px;border-radius:8px;font-weight:bold;margin:10px;font-weight:700}
.field-container{display:flex;justify-content:center;gap:25px;margin-top:40px;flex-wrap:wrap}
.pitch{width:400px;height:550px;background:linear-gradient(#0a5c36,#0a5c36);border:3px solid #fff;border-radius:10px;position:relative;overflow:hidden;margin-top:10px}
.pitch::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background:#fff}
.pitch::after{content:'';position:absolute;top:50%;left:50%;width:90px;height:90px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.team-title{padding:8px;font-weight:900;font-size:17px;border-radius:8px 8px 0 0;margin-bottom:5px}
.team-title.blue{background:#00aaff;color:#000}
.team-title.red{background:#ff4444;color:#fff}
.player-spot{position:absolute;width:85px;text-align:center;transform:translate(-50%,-50%)}
.player-spot img{width:55px;height:55px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222}
.player-spot.name{font-size:10px;font-weight:700;margin-top:2px;text-shadow:1px 1px 3px #000;white-space:nowrap}
.player-spot.pos-label{font-size:9px;color:#ffd700;font-weight:900}
.player-spot.empty img{opacity:0.2;border:2px dashed #888}
.pos-GK{bottom:8%;left:50%}
.pos-LB{bottom:22%;left:12%}
.pos-CB1{bottom:18%;left:38%}
.pos-CB2{bottom:18%;left:62%}
.pos-RB{bottom:22%;left:88%}
.pos-CM1{bottom:35%;left:32%}
.pos-CM2{bottom:35%;left:68%}
.pos-CAM{bottom:50%;left:50%}
.pos-LW{bottom:70%;left:18%}
.pos-ST{bottom:75%;left:50%}
.pos-RW{bottom:70%;left:82%}
.card{border:3px solid #ffd700;border-radius:15px;padding:15px;width:360px;margin:15px auto;background:rgba(17,17,17,0.95)}
.card img{width:110px;height:110px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;margin-bottom:10px}
.pos{color:#aaa;font-size:14px;font-weight:400}
.name{font-size:24px;color:#ffd700;margin:5px;font-weight:900}
.price{font-size:18px;color:#0f0;font-weight:700}
input{width:140px;padding:8px;border-radius:8px;border:2px solid #ffd700;background:#222;color:#fff;text-align:center;font-family:'Cairo'}
button{padding:10px 15px;margin:4px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:16px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>
<body>

<h1>⚽ مزاد النجوم - 100 لاعب ⚽</h1>
<div class="stats"><div class="p1"><span id="name1">انت</span>: <span id="m1">200,000,000</span>$</div><div id="count">1 / 11</div><div class="p2"><span id="name2">الخصم</span>: <span id="m2">200,000,000</span>$</div></div>
<div class="turn" id="turn">دور المزايدة:...</div>

<div class="field-container">
  <div><div class="team-title blue" id="team1Title">الفريق الازرق</div><div class="pitch" id="pitch1"></div></div>
  <div><div class="team-title red" id="team2Title">الفريق الاحمر</div><div class="pitch" id="pitch2"></div></div>
</div>

<div class="card">
  <img id="playerImg" src="https://i.postimg.cc/3J5sPzQY/player.png">
  <div class="pos" id="pos"></div>
  <div class="name" id="name"></div>
  <div class="price" id="price"></div>
  <input id="bidInput" type="number" placeholder="اكتب المزايدة"><br>
  <button class="bid" id="bidBtn" onclick="bid()">مزايدة</button>
  <button class="take" id="takeBtn" onclick="take()">خده</button>
  <button class="skip" onclick="skip()">تخطي</button>
</div>

CM2: [{n:"Modric", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/modric.jpg"},{n:"Gundogan", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/gundogan.jpg"},{n:"Bruno G", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/brunog.jpg"},{n:"Caicedo", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/caicedo.jpg"},{n:"Enzo", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/enzo.jpg"},{n:"Zubimendi", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/zubimendi.jpg"},{n:"Tonali", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/tonali.jpg"},{n:"Locatelli", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/locatelli.jpg"},{n:"Gravenberch", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/gravenberch.jpg"},{n:"Mount", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/mount.jpg"}],
CAM: [{n:"De Bruyne", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/debruyne.jpg"},{n:"Bellingham", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/bellingham.jpg"},{n:"Messi", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/messi.jpg"},{n:"B.Fernandes", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/bfernandes.jpg"},{n:"B.Silva", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/bsilva.jpg"},{n:"Wirtz", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/wirtz.jpg"},{n:"Musiala", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/musiala.jpg"},{n:"Griezmann", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/griezmann.jpg"},{n:"Maddison", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/maddison.jpg"},{n:"Havertz", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/havertz.jpg"}],
LW: [{n:"Neymar", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/neymar.jpg"},{n:"Leao", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/leao.jpg"},{n:"Vinicius", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/vinicius.jpg"},{n:"Sane", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/sane.jpg"},{n:"Rashford", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/rashford.jpg"},{n:"Coman", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/coman.jpg"},{n:"Sterling", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/sterling.jpg"},{n:"L.Diaz", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/ldiaz.jpg"},{n:"Martinelli", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/martinelli.jpg"},{n:"Barcola", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/barcola.jpg"}],
ST: [{n:"Haaland", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/haaland.jpg"},{n:"Mbappe", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/mbappe.jpg"},{n:"Lewandowski", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/lewa.jpg"},{n:"Kane", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/kane.jpg"},{n:"Lautaro", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/lautaro.jpg"},{n:"Osimhen", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/osimhen.jpg"},{n:"Nunez", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/nunez.jpg"},{n:"G.Jesus", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/gjesus.jpg"},{n:"Vlahovic", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/vlahovic.jpg"},{n:"Isak", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/isak.jpg"}],
RW: [{n:"Salah", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/salah.jpg"},{n:"Saka", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/saka.jpg"},{n:"Mahrez", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/mahrez.jpg"},{n:"Rodrygo", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/rodrygo.jpg"},{n:"Foden", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/foden.jpg"},{n:"Dembele", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/dembele.jpg"},{n:"Bowen", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/bowen.jpg"},{n:"P.Neto", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/pneto.jpg"},{n:"Grealish", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/grealish.jpg"},{n:"Antony", p:PRICE, img:"https://i.postimg.cc/Nf1Qp8gT/antony.jpg"}]

let currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let turn=1, m1=200000, m2=200000, starter=1;
let t1={}, t2={};
let filled1={}, filled2={};

function drawPitch(){
  positions.forEach(pos=>{
    document.getElementById('pitch1').innerHTML += `<div class="player-spot pos-${pos} empty" id="p1-${pos}"><img src="https://i.postimg.cc/3J5sPzQY/player.png"><div class="pos-label">${pos}</div><div class="name">-</div></div>`;
    document.getElementById('pitch2').innerHTML += `<div class="player-spot pos-${pos} empty" id="p2-${pos}"><img src="https://i.postimg.cc/3J5sPzQY/player.png"><div class="pos-label">${pos}</div><div class="name">-</div></div>`;
  })
}
drawPitch();

const roomRef = db.ref('rooms/' + type + '/' + room);
roomRef.on('value', async (snapshot) => {
  let data = snapshot.val()
  if(!data) return;
  document.getElementById('name1').innerText = data.player1?.name || 'الازرق';
  document.getElementById('name2').innerText = data.player2?.name || 'الاحمر';
  document.getElementById('team1Title').innerText = data.player1?.name || 'الفريق الازرق';
  document.getElementById('team2Title').innerText = data.player2?.name || 'الفريق الاحمر';
  await loadData(data);
})

async function loadData(data){
  currentPosIndex=data.currentPos||0;currentBid=data.currentBid||0;highestBidder=data.highestBidder||0;turn=data.turn||1;starter=data.starter||1;m1=data.m1 || 200000;m2=data.m2 || 200000;t1=data.t1 || {};t2=data.t2 || {};currentPlayer=data.currentPlayer || null;filled1=data.filled1 || {};filled2=data.filled2 || {};
  let currentPos = positions[currentPosIndex];
  if(filled1[currentPos] && filled2[currentPos] && currentPosIndex < 10 && amIHost){
    roomRef.update({currentPos: currentPosIndex + 1})
    return;
  }
  if(currentPosIndex >= 11 && amIHost){alert("خلص المزاد");return;}
  if(!currentPlayer &&!filled1[currentPos] &&!filled2[currentPos] && amIHost) newPlayer();
  await updatePitch();show();
}

function getRandomPlayer(pos){let data = playersDB[pos];return data[Math.floor(Math.random()*data.length)];}
function newPlayer(){let posName=positions[currentPosIndex];let p = getRandomPlayer(posName);roomRef.update({ currentBid: p.p, currentPlayer: p })}

async function show(){
  if(!currentPlayer) return;
  document.getElementById('pos').innerText="المركز: " + positions[currentPosIndex];
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('playerImg').src = currentPlayer.img;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+1000000;
  let myTurn = turn==myPlayer;
  document.getElementById('bidBtn').disabled =!myTurn;
  document.getElementById('takeBtn').disabled =!myTurn;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?document.getElementById('name1').innerText:document.getElementById('name2').innerText) + (myTurn?" - دورك":"");
}

function bid(){if(turn!=myPlayer) return;let val=parseInt(document.getElementById('bidInput').value);let money=myPlayer==1?m1:m2;if(isNaN(val)){alert("اكتب رقم");return}if(val<=currentBid){alert("لازم تعلي");return}if(val>money){alert("مفيش فلوس");return}roomRef.update({currentBid:val, highestBidder:myPlayer, turn:myPlayer==1?2:1});}

// منطق "خده" الصح: الخصم ياخد لاعب المزاد ويدفع. انا اخد عشوائي ببلاش
function take(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];
  let taker = myPlayer;
  let other = myPlayer==1? 2 : 1;
  let auctionPlayer = currentPlayer;
  let randomPlayer = getRandomPlayer(pos);

  let updates={};
  if(other==1){
    updates["m1"]=m1-currentBid;
    updates["t1/"+pos]=auctionPlayer;
    updates["filled1/"+pos]=true;
  } else {
    updates["m2"]=m2-currentBid;
    updates["t2/"+pos]=auctionPlayer;
    updates["filled2/"+pos]=true;
  }

  if(taker==1){
    updates["t1/"+pos]=randomPlayer;
    updates["filled1/"+pos]=true;
  } else {
    updates["t2/"+pos]=randomPlayer;
    updates["filled2/"+pos]=true;
  }

  updates["currentPlayer"]=null;updates["currentBid"]=0;updates["highestBidder"]=0;
  roomRef.update(updates);
}

function skip(){
  if(turn!=myPlayer) return;
  let pos = positions[currentPosIndex];
  let updates={};
  updates["t1/"+pos]=getRandomPlayer(pos);
  updates["t2/"+pos]=getRandomPlayer(pos);
  updates["filled1/"+pos]=true;
  updates["filled2/"+pos]=true;
  updates["currentPlayer"]=null;
  roomRef.update(updates);
}

async function updatePitch(){
  document.getElementById('m1').innerText=m1.toLocaleString();document.getElementById('m2').innerText=m2.toLocaleString();document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  for(let pos of positions){
    if(t1[pos]){
      document.getElementById('p1-'+pos).innerHTML=`<img src="${t1[pos].img}"><div class="pos-label">${pos}</div><div class="name">${t1[pos].n}</div>`;
      document.getElementById('p1-'+pos).classList.remove('empty');
    }
    if(t2[pos]){
      document.getElementById('p2-'+pos).innerHTML=`<img src="${t2[pos].img}"><div class="pos-label">${pos}</div><div class="name">${t2[pos].n}</div>`;
      document.getElementById('p2-'+pos).classList.remove('empty');
    }
  }
}
