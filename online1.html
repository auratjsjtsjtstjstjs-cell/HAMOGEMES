{n:"بيل10", p:9000000}, {n:"روني10", p:8000000}, {n:"جيرارد10", p:7000000}, {n:"لامبارد10", p:6000000}, {n:"سكولز10", p:5000000},
{n:"نيفيل10", p:4000000}, {n:"جاري10", p:3000000}, {n:"فيل10", p:2000000}, {n:"مايكل10", p:1000000}, {n:"ستيفن28", p:900000},
{n:"ديفيد10", p:800000}, {n:"جون10", p:700000}, {n:"مايك10", p:600000}, {n:"كريس10", p:500000}, {n:"مارك24", p:400000},
{n:"بول21", p:300000}, {n:"ريتشارد8", p:200000}
]
};

let myPlayer=0, currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let m1=200000000, m2=200000000, turn=1, starter=1;
let t1=Array(11).fill(null), t2=Array(11).fill(null);
let filled1=Array(11).fill(false), filled2=Array(11).fill(false);
let whoPassed=0;

positions.forEach((pos,i)=>{
  document.getElementById('t1').innerHTML+=`<div class="slot" id="t1-${i}"><b>${pos}</b><br>-</div>`;
  document.getElementById('t2').innerHTML+=`<div class="slot" id="t2-${i}"><b>${pos}</b><br>-</div>`;
})

const roomRef = db.ref('rooms/' + type + '/' + room);

roomRef.on('value', (snapshot) => {
  let data = snapshot.val()
  if(!data) return;

  if(amIHost){
    myPlayer=1;
    document.getElementById('name1').innerText=myName.split('@')[0];
    document.getElementById('name2').innerText=data.player2?.name||'الخصم';
  } else {
    myPlayer=2;
    document.getElementById('name2').innerText=myName.split('@')[0];
    document.getElementById('name1').innerText=data.player1?.name||'الخصم';
  }

  loadData(data);
})

function loadData(data){
  currentPosIndex=data.currentPos||0;
  currentBid=data.currentBid||0;
  highestBidder=data.highestBidder||0;
  turn=data.turn||1;
  starter=data.starter||1;
  whoPassed=data.whoPassed||0;
  m1=data.m1 || 200000000;
  m2=data.m2 || 200000000;
  t1=data.t1 || Array(11).fill(null);
  t2=data.t2 || Array(11).fill(null);
  currentPlayer=data.currentPlayer || null;
  filled1=data.filled1 || Array(11).fill(false);
  filled2=data.filled2 || Array(11).fill(false);

  if(filled1[currentPosIndex] && filled2[currentPosIndex] && currentPosIndex < 10 && amIHost){
    let nextStarter = starter==1? 2 : 1;
    roomRef.update({currentPos: currentPosIndex + 1, starter: nextStarter, turn: nextStarter, whoPassed:0});
    return;
  }

  if(!currentPlayer &&!filled1[currentPosIndex] &&!filled2[currentPosIndex] && amIHost) newPlayer();

  update();
  loadPlayer();
}

function getRandomPlayer(pos){
  let data = playersDB[pos];
  if(!data) return {n:"لاعب", p:10000000};
  return data[Math.floor(Math.random()*data.length)];
}

function newPlayer(){
  let posName=positions[currentPosIndex];
  let p = getRandomPlayer(posName);
  roomRef.update({ currentBid: p.p, currentPlayer: p })
}

function loadPlayer(){
  if(filled1[currentPosIndex] && filled2[currentPosIndex]) return;
  if(!currentPlayer) return;
  document.getElementById('pos').innerText="المركز: " + positions[currentPosIndex];
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+
    document.getElementById('bidInput').value=currentBid+1000000;
  let myTurn = turn==myPlayer;
  document.getElementById('bidBtn').disabled =!myTurn;
  document.getElementById('takeBtn').disabled =!myTurn || highestBidder==0;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?document.getElementById('name1').innerText:document.getElementById('name2').innerText) + (myTurn?" - دورك":"");
}

function bid(){
  if(turn!=myPlayer) return;
  let val=parseInt(document.getElementById('bidInput').value);
  let money=myPlayer==1?m1:m2;
  if(isNaN(val)){alert("اكتب رقم");return}
  if(val<=currentBid){alert("لازم تعلي");return}
  if(val>money){alert("مفيش فلوس");return}
  roomRef.update({currentBid:val, highestBidder:myPlayer, turn:myPlayer==1?2:1});
}

function take(){
  if(turn!=myPlayer) return;
  if(highestBidder==0){alert("لازم حد يزايد الاول");return}

  let receiver = myPlayer;
  let other = receiver==1? 2 : 1;
  let takenPlayer = currentPlayer;

  let updates={};
  if(receiver==1){
    updates["m1"]=m1-currentBid;
    updates["t1/"+currentPosIndex]=takenPlayer;
    updates["filled1/"+currentPosIndex]=true;
  } else {
    updates["m2"]=m2-currentBid;
    updates["t2/"+currentPosIndex]=takenPlayer;
    updates["filled2/"+currentPosIndex]=true;
  }

  updates["currentPlayer"]=null;
  updates["currentBid"]=0;
  updates["highestBidder"]=0;
  updates["turn"]=other;
  updates["whoPassed"]=0;

  roomRef.update(updates);
}

function skip(){
  if(turn!=myPlayer) return;
  let updates={};
  if(whoPassed==0){
    updates["whoPassed"]=myPlayer;
    updates["turn"]=myPlayer==1?2:1;
  } else if(whoPassed!=myPlayer){
    updates["filled1/"+currentPosIndex]=true;
    updates["filled2/"+currentPosIndex]=true;
    updates["whoPassed"]=0;
    updates["currentPlayer"]=null;
  }
  roomRef.update(updates);
}

function update(){
  document.getElementById('m1').innerText=m1.toLocaleString();
  document.getElementById('m2').innerText=m2.toLocaleString();
  document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  t1.forEach((p,i)=>{if(p){document.getElementById('t1-'+i).innerHTML=`<b>${positions[i]}</b><br>${p.n}`;document.getElementById('t1-'+i).classList.add('filled')}});
  t2.forEach((p,i)=>{if(p){document.getElementById('t2-'+i).innerHTML=`<b>${positions[i]}</b><br>${p.n}`;document.getElementById('t2-'+i).classList.add('filled')}});
}
</script>
