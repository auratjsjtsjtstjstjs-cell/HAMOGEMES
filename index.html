<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - مزاد النجوم</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
    background-size: 400% 400%;
    animation: gradient 15s ease infinite;
    overflow: hidden;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* صندوق تسجيل الدخول */
  .login-box {
    width: 350px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 40px rgba(138, 43, 226, 0.5);
    text-align: center;
    animation: fadeIn 1s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .login-box h2 { color: #fff; font-size: 28px; margin-bottom: 30px; text-shadow: 0 0 15px #8a2be2; }
  .input-box { position: relative; margin-bottom: 30px; }
  .input-box input {
    width: 100%; padding: 12px 0; background: transparent; border: none;
    border-bottom: 2px solid #8a2be2; outline: none; color: #fff; font-size: 16px;
  }
  .input-box label {
    position: absolute; top: 12px; right: 0; color: #aaa;
    pointer-events: none; transition: 0.5s;
  }
  .input-box input:focus ~ label,
  .input-box input:valid ~ label { top: -20px; font-size: 12px; color: #8a2be2; }
  .btn {
    width: 100%; padding: 14px; background: linear-gradient(90deg, #8a2be2, #ff00ff);
    border: none; border-radius: 10px; color: #fff; font-size: 18px;
    font-weight: bold; cursor: pointer; transition: 0.3s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff00ff; }

  /* شاشة التحميل الاسطورية */
  #loading-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none; /* مخفي في الاول */
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #000;
    z-index: 999;
  }
  .energy-circle {
    width: 100px;
    height: 100px;
    border: 3px solid transparent;
    border-top: 3px solid #8a2be2;
    border-right: 3px solid #ff00ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 30px #8a2be2;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text {
    margin-top: 30px;
    color: #fff;
    font-size: 22px;
    letter-spacing: 3px;
    animation: glow 1.5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #8a2be2; }
    to { text-shadow: 0 0 25px #ff00ff; }
  }
  /* نجوم بتلمع في الخلفية */
  .stars { position: absolute; width: 100%; height: 100%; }
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<!-- صندوق تسجيل الدخول -->
<div class="login-box" id="login-box">
  <h2>مرحبا بعودتك</h2>
  <form onsubmit="showLoading(event)">
    <div class="input-box">
      <input type="text" required>
      <label>اسم المستخدم</label>
    </div>
    <div class="input-box">
      <input type="password" required>
      <label>كلمة المرور</label>
    </div>
    <button type="submit" class="btn">دخول</button>
  </form>
</div>

<!-- شاشة التحميل الاسطورية -->
<div id="loading-screen">
  <div class="stars" id="stars"></div>
  <div class="energy-circle"></div>
  <div class="loading-text">جاري تسجيل الدخول...</div>
</div>

<script>
  // نعمل نجوم عشوائية
  const starsContainer = document.getElementById('stars');
  for(let i=0; i<50; i++){
    let star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    starsContainer.appendChild(star);
  }

  function showLoading(e){
    e.preventDefault();
    
    // اخفي الفورم واظهر اللودينج
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'flex';
    
    // بعد 3 ثواني روح على home.html
    setTimeout(function(){
      window.location.href = 'home.html'; 
    }, 3000); // تقدر تخليها 2000 لو عايز اسرع
  }
</script>

</body>
</html>
