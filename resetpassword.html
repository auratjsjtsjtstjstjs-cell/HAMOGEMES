<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اعادة تعيين كلمة السر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:400px;background: rgba(255,255,255,0.95);border-radius: 25px;padding:40px 30px;text-align:center}
h1{font-size:24px;font-weight:900;color:#333;margin-bottom:15px}
input{width:100%;padding:14px 18px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;font-family:'Cairo';margin:10px 0}
button{width:100%;padding:16px;background: linear-gradient(90deg, #667eea, #764ba2);border:none;border-radius:12px;color:#fff;font-size:18px;font-weight:900;cursor:pointer;margin-top:10px}
.error{color:#ff4444;margin:10px 0;font-weight:700}
.success{color:#00aa00;margin:10px 0;font-weight:700}
</style>
</head>
<body>

<div class="container">
  <h1 id="title">تعيين كلمة سر جديدة</h1>
  <p class="error" id="error"></p>
  <p class="success" id="success"></p>
  
  <div id="form">
    <input type="password" id="newPassword" placeholder="كلمة السر الجديدة 6 حروف" minlength="6">
    <button onclick="resetPassword()">تأكيد</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",
  authDomain: "mazad-noogom.firebaseapp.com",
  databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com",
  projectId: "mazad-noogom",
  storageBucket: "mazad-noogom.firebasestorage.app",
  messagingSenderId: "183884985831",
  appId: "1:183884985831:web:db231949dace2b0798b942"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode');
const oobCode = urlParams.get('oobCode');

const error = document.getElementById('error');
const success = document.getElementById('success');
const form = document.getElementById('form');
const title = document.getElementById('title');

// اول ما الصفحة تفتح نتأكد ان الكود صح
if(mode !== 'resetPassword' || !oobCode){
  error.innerText = 'الرابط غلط او منتهي';
  form.style.display = 'none';
} else {
  verifyPasswordResetCode(auth, oobCode).catch(() => {
    error.innerText = 'الرابط منتهي. اطلب رابط جديد';
    form.style.display = 'none';
  });
}

function resetPassword(){
  const newPass = document.getElementById('newPassword').value;
  if(newPass.length < 6){
    error.innerText = 'كلمة السر لازم 6 حروف';
    return;
  }

  confirmPasswordReset(auth, oobCode, newPass)
  .then(() => {
    success.innerText = '✅ تم تغيير كلمة السر بنجاح. تقدر تسجل دخول دلوقتي';
    form.style.display = 'none';
    setTimeout(() => window.location.href = 'login.html', 3000);
  })
  .catch(() => {
    error.innerText = 'حصل خطأ. الرابط ممكن يكون استخدمته قبل كده';
  });
}
</script>
</body>
</html>
