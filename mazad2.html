<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم - ضد AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{background:#0a0a0a;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:10px}
.stats{display:flex;justify-content:space-around;background:#111;padding:10px;border-radius:10px;margin-bottom:10px}
.p1{color:#00aaff}.p2{color:#ff4444}
.turn{background:#ffd700;color:#000;padding:8px;border-radius:8px;font-weight:bold;margin:10px;font-weight:700}
.field{display:flex;justify-content:space-around}
.team{width:48%;background:#111;border:2px solid #333;border-radius:10px;padding:10px}
.slot{border:2px solid #555;background:#000;margin:5px;padding:12px;border-radius:8px;font-size:13px;min-height:25px;font-weight:700}
.slot.filled{border-color:#ffd700;background:#1a1a1a}
.card{border:3px solid #ffd700;border-radius:15px;padding:15px;width:320px;margin:15px auto;background:#111}
.pos{color:#aaa;font-size:14px;font-weight:400}
.name{font-size:22px;color:#ffd700;margin:5px;font-weight:900}
.price{font-size:18px;color:#0f0;font-weight:700}
input{width:130px;padding:8px;border-radius:8px;border:2px solid #ffd700;background:#222;color:#fff;text-align:center;font-family:'Cairo'}
button{padding:10px 15px;margin:4px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:16px}
.bid{background:lime;color:#000}.take{background:red;color:#fff}.skip{background:#555;color:#fff}
button:disabled{opacity:0.5;cursor:not-allowed}
#loading{ position:fixed;top:0;left:0;width:100%;height:100%; background:radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%); display:none;justify-content:center; align-items:center;flex-direction:column;z-index:999; }
.ball{ width:120px;height:120px;border-radius:50%; background:conic-gradient(from 0deg, #fff 0deg 45deg, #000 45deg 90deg, #fff 90deg 135deg, #000 135deg 180deg, #fff 180deg 225deg, #000 225deg 270deg, #fff 270deg 315deg, #000 315deg 360deg); animation:spin 1.5s linear infinite; box-shadow:0 0 40px #ffd700, 0 0 80px #ffd700; border:4px solid #ffd700; }
@keyframes spin{100%{transform:rotate(360deg)}}
#aiText{margin-top:30px;font-size:28px;color:#ffd700;font-weight:900;text-shadow:0 0 10px #ffd700;animation:pulse 1.5s infinite}
#aiSubText{margin-top:10px;font-size:18px;color:#aaa;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.result-box{ background:#111;border:2px solid #ffd700;border-radius:20px; padding:25px;margin-top:20px;width:80%;max-width:400px }
</style>
</head>
<body>

<h1>⚽ مزاد النجوم - ضد الذكاء الاصطناعي ⚽</h1>
<div class="stats"><div class="p1">انت: <span id="m1">200,000,000</span>$</div><div id="count">1 / 11</div><div class="p2">AI: <span id="m2">200,000,000</span>$</div></div>
<div class="turn" id="turn">دور المزايدة: انت</div>
<div class="field"><div class="team"><h3 class="p1">فريقك</h3><div id="t1"></div></div><div class="team"><h3 class="p2">فريق AI</h3><div id="t2"></div></div></div>
<div class="card"><div class="pos" id="pos"></div><div class="name" id="name"></div><div class="price" id="price"></div><input id="bidInput" type="number" placeholder="اكتب المزايدة"><br><button class="bid" id="bidBtn" onclick="bid()">مزايدة</button><button class="take" id="takeBtn" onclick="take()">خده</button><button class="skip" onclick="skip()">تخطي</button></div>
<div id="loading"><div class="ball"></div><div id="aiText">الذكاء الاصطناعي يحلل</div><div id="aiSubText">جاري تقييم التشكيلات...</div><div class="result-box" id="resultBox" style="display:none;"></div></div>

<script>
const positions = ["GK","LB","CB1","CB2","RB","CAM","CM1","CM2","RW","ST","LW"];
let usedPlayers = [];

// 70+ لاعب عشان ميخلصوش
const playersDB = {
GK: { star: [{n:"كورتوا ⭐", p:15000000}, {n:"اليسون ⭐", p:14000000}, {n:"تير شتيجن ⭐", p:13000000}, {n:"دوناروما ⭐", p:14500000}, {n:"اوبلاك ⭐", p:13500000}, {n:"نوير ⭐", p:12000000}, {n:"ادرسون ⭐", p:12500000}], common: [{n:"تراب", p:7000000}, {n:"مندي", p:6000000}, {n:"رايا", p:8500000}, {n:"مارتينيز", p:9000000}, {n:"بيكفورد", p:7500000}, {n:"سومر", p:6500000}, {n:"اونانا", p:8000000}] },
ST: { star: [{n:"هالاند ⭐", p:60000000}, {n:"مبابي ⭐", p:65000000}, {n:"ليفاندوفسكي ⭐", p:50000000}, {n:"كين ⭐", p:55000000}, {n:"بنزيما ⭐", p:48000000}, {n:"سواريز ⭐", p:40000000}], common: [{n:"جيرو", p:20000000}, {n:"ووتكينز", p:30000000}, {n:"ايساك", p:35000000}, {n:"داروين", p:32000000}, {n:"خيسوس", p:28000000}, {n:"تونى", p:27000000}] },
RW: { star: [{n:"محمد صلاح ⭐", p:50000000}, {n:"ساكا ⭐", p:45000000}, {n:"راشفورد ⭐", p:42000000}, {n:"جرينليش ⭐", p:40000000}, {n:"ديابي ⭐", p:38000000}], common: [{n:"انطوني", p:35000000}, {n:"محرز", p:30000000}, {n:"بودينس", p:20000000}] },
CAM: { star: [{n:"دي بروين ⭐", p:50000000}, {n:"بيلينجهام ⭐", p:55000000}, {n:"ميسي ⭐", p:60000000}, {n:"برونو ⭐", p:45000000}, {n:"اوديجارد ⭐", p:40000000}, {n:"فودين ⭐", p:48000000}], common: [{n:"ديبالا", p:35000000}, {n:"ماديسون", p:32000000}, {n:"كوتينيو", p:25000000}] },
CM: { star: [{n:"رودري ⭐", p:45000000}, {n:"فالفيردي ⭐", p:40000000}, {n:"كروس ⭐", p:35000000}, {n:"مودريتش ⭐", p:30000000}, {n:"كاسيميرو ⭐", p:28000000}, {n:"كامافينجا ⭐", p:38000000}], common: [{n:"رايس", p:40000000}, {n:"باريلا", p:26000000}, {n:"جوندوجان", p:25000000}, {n:"فابينيو", p:22000000}] },
CB: { star: [{n:"فان دايك ⭐", p:40000000}, {n:"روبن دياز ⭐", p:38000000}, {n:"روديجر ⭐", p:35000000}, {n:"سالiba ⭐", p:37000000}, {n:"اراوخو ⭐", p:36000000}, {n:"ماركينيوس ⭐", p:34000000}], common: [{n:"جفارديول", p:40000000}, {n:"تومياسو", p:20000000}, {n:"جابرييل", p:22000000}, {n:"كونسا", p:18000000}, {n:"روميرو", p:25000000}] },
LB: { star: [{n:"الفونسو ديفيز ⭐", p:35000000}, {n:"روبرتسون ⭐", p:30000000}, {n:"ثيو ⭐", p:32000000}, {n:"كانسيلو ⭐", p:33000000}], common: [{n:"جوسينس", p:17000000}, {n:"تشيلويل", p:22000000}, {n:"شو", p:20000000}] },
RB: { star: [{n:"اشرف حكيمي ⭐", p:40000000}, {n:"ترينت ⭐", p:38000000}, {n:"ووكر ⭐", p:30000000}, {n:"رايس جيمس ⭐", p:35000000}], common: [{n:"بافارد", p:25000000}, {n:"توموري", p:20000000}, {n:"دالوت", p:18000000}] },
LW: { star: [{n:"نيمار ⭐", p:45000000}, {n:"لياو ⭐", p:42000000}, {n:"فينيسيوس ⭐", p:62000000}, {n:"ساني ⭐", p:40000000}, {n:"كومان ⭐", p:38000000}], common: [{n:"باركولا", p:30000000}, {n:"مارتينيلي", p:35000000}, {n:"جريليش", p:28000000}] }
};

let currentPosIndex=0, currentPlayer, currentBid=0, highestBidder=0;
let turn=1, m1=200000000, m2=200000000;
let t1=Array(11).fill(null), t2=Array(11).fill(null);
let isAIThinking = false;
let aiBidCount = 0;

positions.forEach((pos,i)=>{ document.getElementById('t1').innerHTML+=`<div class="slot" id="t1-${i}"><b>${pos}</b><br>-</div>`; document.getElementById('t2').innerHTML+=`<div class="slot" id="t2-${i}"><b>${pos}</b><br>-</div>`; })

// دالة حفظ في الذاكرة
function حفظ_النتيجة(اسم_اللعبة, النتيجة, الاسكور){
    let سجل = JSON.parse(localStorage.getItem('سجل_الذاكرة')) || [];
    let تاريخ = new Date().toLocaleString('ar-EG');
    سجل.unshift({لعبة: اسم_اللعبة, نتيجة: النتيجة, اسكور: الاسكور, وقت: تاريخ});
    if(سجل.length > 20) سجل.pop();
    localStorage.setItem('سجل_الذاكرة', JSON.stringify(سجل));
}

function getRandomPlayer(pos){
  let key = pos.startsWith("CB")? "CB" : pos.startsWith("CM")? "CM" : pos;
  let data = playersDB[key];
  let allPlayers = [...data.star,...data.common];
  let available = allPlayers.filter(p =>!usedPlayers.includes(p.n));
  if(available.length === 0) {usedPlayers = []; available = allPlayers;}
  let player = available[Math.floor(Math.random()*available.length)];
  usedPlayers.push(player.n);
  return player;
}

function newPlayer(){
  isAIThinking = false; aiBidCount = 0;
  let posName=positions[currentPosIndex];
  document.getElementById('pos').innerText="المركز: " + posName;
  currentPlayer=getRandomPlayer(posName);
  currentBid=currentPlayer.p; highestBidder=0;
  show();
  if(turn==2) setTimeout(aiMove, 1000);
}

function show(){
  document.getElementById('name').innerText=currentPlayer.n;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  document.getElementById('bidInput').value=currentBid+1000000;
  document.getElementById('bidBtn').disabled = turn==2;
  document.getElementById('takeBtn').disabled = turn==2;
}

function bid(){
  let val=parseInt(document.getElementById('bidInput').value);
  let money=turn==1?m1:m2;
  if(isNaN(val)){alert("اكتب رقم");return}
  if(val<=currentBid){alert("لازم تعلي عن "+currentBid.toLocaleString());return}
  if(val>money){alert("مفيش فلوس معاك "+money.toLocaleString());return}
  currentBid=val; highestBidder=turn;
  document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
  turn=turn==1?2:1;
  document.getElementById('turn').innerText="دور المزايدة: " + (turn==1?"انت":"AI");
  show();
  if(turn==2) setTimeout(aiMove, 1000);
}

function take(){
  if(highestBidder==0){alert("لازم حد يزايد الاول");return}
  doTake(highestBidder);
}

function doTake(winner){
  let loser=winner==1?2:1;
  if(winner==1){m1-=currentBid; t1[currentPosIndex]=currentPlayer;}
  else{m2-=currentBid; t2[currentPosIndex]=currentPlayer;}
  let rand=getRandomPlayer(positions[currentPosIndex]);
  if(loser==1) t1[currentPosIndex]=rand;
  else t2[currentPosIndex]=rand;
  update();
  nextPos();
}

function skip(){nextPos()}

// AI: يزايد مرة واحدة بس وبعدين "خده"
function aiMove(){
  if(isAIThinking) return;
  isAIThinking = true;
  let aiMoney = m2;
  let wantPlayer = Math.random() < 0.7;
  if(currentPlayer.n.includes("⭐")) wantPlayer = Math.random() < 0.9;

  setTimeout(() => {
    if(aiBidCount < 1 && wantPlayer && aiMoney > currentBid + 1000000){
      let newBid = currentBid + Math.floor(Math.random()*5000000 + 1000000);
      if(newBid > aiMoney) newBid = aiMoney;
      currentBid = newBid; highestBidder = 2; aiBidCount++;
      document.getElementById('price').innerText="السعر: "+currentBid.toLocaleString()+"$";
      turn = 1; document.getElementById('turn').innerText="دور المزايدة: انت";
      show();
    } else {
      document.getElementById('turn').innerText="🤖 AI: خده!";
      setTimeout(() => { doTake(2); }, 1000);
    }
    isAIThinking = false;
  }, 1500);
}

function nextPos(){
  currentPosIndex++;
  if(currentPosIndex>=11){
    document.getElementById('loading').style.display = 'flex';
    setTimeout(aiEvaluate, 3500);
    return;
  }
  document.getElementById('count').innerText=(currentPosIndex+1)+" / 11";
  turn=1;
  document.getElementById('turn').innerText="دور المزايدة: انت";
  newPlayer();
}

// ===== AI المحلل + الذاكرة + التذاكر =====
function aiEvaluate(){
  let score1 = 0, score2 = 0, stars1=0, stars2=0;
  t1.forEach(p => { if(p){ score1 += p.p; if(p.n.includes("⭐")) {score1 += 10000000; stars1++;} } });
  t2.forEach(p => { if(p){ score2 += p.p; if(p.n.includes("⭐")) {score2 += 10000000; stars2++;} } });

  let النتيجة; let winnerText = ""; let winnerColor = "#ffd700"; let انا_كسبت = false;
  if(score1 > score2) {النتيجة="فوز"; winnerText = "🏆 الفائز: انت"; winnerColor="lime"; انا_كسبت = true;}
  else if(score2 > score1) {النتيجة="خسارة"; winnerText = "🏆 الفائز: الذكاء الاصطناعي"; winnerColor="#ff4444";}
  else {النتيجة="تعادل"; winnerText = "🤝 النتيجة: تعادل";}

  // 1. احفظ في الذاكرة
  حفظ_النتيجة("مزاد النجوم", النتيجة, `${(score1/1000000).toFixed(1)}M - ${(score2/1000000).toFixed(1)}M`);

  document.getElementById('aiText').innerText = "اكتمل التحليل";
  document.getElementById('aiSubText').style.display = "none";
  document.getElementById('resultBox').style.display = "block";
  document.getElementById('resultBox').innerHTML = `
    <div style="font-size:24px;font-weight:900;color:${winnerColor};margin-bottom:15px">${winnerText}</div>
    <div style="display:flex;justify-content:space-between;margin:10px 0"><span>فريقك:</span><span style="color:#00aaff;font-weight:700">${(score1/1000000).toFixed(1)} مليون | ${stars1} نجوم</span></div>
    <div style="display:flex;justify-content:space-between;margin:10px 0"><span>فريق AI:</span><span style="color:#ff4444;font-weight:700">${(score2/1000000).toFixed(1)} مليون | ${stars2} نجوم</span></div>
    <button onclick="ارجع_الرئيسية(${انا_كسبت})" style="margin-top:20px;width:100%;background:#ffd700;color:#000">🔄 العودة للرئيسية</button>`;
}

function ارجع_الرئيسية(كسب){
  // 2. زود تذكرة لو كسب
  if(كسب){
    let التذاكر = parseInt(localStorage.getItem("التذاكر")) || 0;
    التذاكر = التذاكر + 1;
    localStorage.setItem("التذاكر", التذاكر);
  }
  window.location.href = "home.html";
}
// ===== END AI =====

function update(){
  document.getElementById('m1').innerText=m1.toLocaleString();
  document.getElementById('m2').innerText=m2.toLocaleString();
  t1.forEach((p,i)=>{if(p){document.getElementById('t1-'+i).innerHTML=`<b>${positions[i]}</b><br>${p.n}`;document.getElementById('t1-'+i).classList.add('filled')}});
  t2.forEach((p,i)=>{if(p){document.getElementById('t2-'+i).innerHTML=`<b>${positions[i]}</b><br>${p.n}`;document.getElementById('t2-'+i).classList.add('filled')}});
}
newPlayer();
</script>
</body>
</html>
