<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم</title>
<style>
body{background:#000;color:#fff;font-family:Cairo;text-align:center;padding:20px}
h1{color:gold;font-size:30px}
.cards{display:flex; gap:10px; justify-content:center; margin-top:20px}
.card{width:45%; border:2px solid #00ccff; border-radius:15px; padding:10px; cursor:pointer}
.card img{width:100%; border-radius:10px}
.menu{display:none; margin-top:20px; border:2px solid gold; padding:15px; border-radius:15px}
.menu.active{display:block}
button{width:100%; padding:12px; margin:8px 0; border:none; border-radius:10px; font-weight:900; font-size:16px}
</style>
</head>
<body>
<h1>مزاد النجوم</h1>

<div class="cards">
  <div class="card" onclick="document.getElementById('p').classList.add('active')">
    <img src="https://i.postimg.cc/Wdsn7wnd/image.png">
    <div>المزاد الذهبي 👑</div>
  </div>
  <div class="card" onclick="document.getElementById('n').classList.add('active')">
    <img src="https://i.postimg.cc/pmPZBJZr/image.png">
    <div>المزاد العادي ⚽</div>
  </div>
</div>

<div class="menu" id="p">
  <h3>المزاد الذهبي</h3>
  <button style="background:gold">انشاء غرفة</button>
  <button style="background:purple; color:white">ضد الذكاء الاصطناعي</button>
</div>

<div class="menu" id="n">
  <h3>المزاد العادي</h3>
  <button style="background:gold">انشاء غرفة</button>
  <button style="background:purple; color:white">ضد الذكاء الاصطناعي</button>
</div>
</body>
</html>
