<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم - Online</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cairo';color:#fff;min-height:100vh;overflow-x:hidden;
  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
}
@keyframes gradient {
 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
}
.container{max-width:500px;margin:0 auto;padding:30px 20px;text-align:center}
.logo{font-size:45px;font-weight:900;margin-bottom:10px;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(0,0,0,0.6);backdrop-filter:blur(15px);border:2px solid rgba(255,215,0,0.3);border-radius:20px;padding:25px;margin:20px 0;box-shadow:0 0 30px rgba(255,215,0,0.2)}
input{width:100%;padding:16px;margin:12px 0;border-radius:12px;border:2px solid #444;background:rgba(0,0,0,0.7);color:#fff;text-align:center;font-size:17px;font-family:'Cairo'}
.btn{width:100%;padding:16px;margin:10px 0;border:none;border-radius:14px;font-weight:900;cursor:pointer;font-size:18px;font-family:'Cairo';transition:0.3s}
.btn:hover{transform:scale(1.03)}
.btn-primary{background:linear-gradient(90deg,#00aaff,#0088ff);color:#fff;box-shadow:0 0 20px rgba(0,170,255,0.5)}
.btn-secondary{background:linear-gradient(90deg,#ff8800,#ff5500);color:#fff;box-shadow:0 0 20px rgba(255,136,0,0.5)}
.btn-ai{background:linear-gradient(90deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 0 20px rgba(168,85,247,0.5)}
.code-box{display:none;background:rgba(0,0,0,0.8);border:3px dashed gold;padding:25px;margin:20px 0;border-radius:20px;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 20px gold}50%{box-shadow:0 0 40px gold}}
.code{font-size:45px;color:gold;font-weight:900;letter-spacing:8px}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>

<canvas class="particles" id="particles"></canvas>

<div class="container">
  <div class="logo">⚽ مزاد النجوم ⚽</div>
  <p style="color:#aaa;margin-bottom:30px">العب مع صحابك او ضد الذكاء الاصطناعي</p>

  <div class="card">
    <input id="playerName" placeholder="✨ اكتب اسمك الاسطوري ✨">
    
    <button class="btn btn-primary" onclick="createRoom()">👥 انشاء غرفة مع صديق</button>
    
    <button class="btn btn-secondary" onclick="alert('قريباً')">⚡ غرفة عشوائية</button>
    
    <button class="btn btn-ai" onclick="playVsAI()">🤖 اللعب ضد الذكاء الاصطناعي</button>

    <hr style="border:1px solid #333;margin:20px 0">
    
    <input id="joinCode" placeholder="🔑 ادخل كود الغرفة هنا">
    <button class="btn btn-primary" onclick="joinWithCode()">دخول بالكود</button>
  </div>

  <div class="card code-box" id="codeBox">
    <h2>🔥 الكود بتاعك 🔥</h2>
    <div class="code" id="roomCode"></div>
    <p style="color:#aaa">ابعت الكود ده لصاحبك</p>
    <button class="btn btn-primary" onclick="copyCode()">نسخ الكود</button>
  </div>
</div>

<script>
// خلفية جزيئات اسطورية
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for(let i=0;i<50;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*2+1,sp:Math.random()*2+1})}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(255,215,0,0.7)';particles.forEach(p=>{p.y-=p.sp;if(p.y<0)p.y=canvas.height;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()});requestAnimationFrame(animate)}
animate()

// زرار AI - يودي على mazad2.html
function playVsAI(){
  let name = document.getElementById('playerName').value
  if(name == ''){alert('⚠️ اكتب اسمك الاول'); return}
  window.location.href = 'mazad2.html?name=' + name
}

// زرار انشاء غرفة
function createRoom(){
  let name = document.getElementById('playerName').value
  if(name == ''){alert('⚠️ اكتب اسمك الاول'); return}
  let code = Math.random().toString(36).substring(2,6).toUpperCase()
  document.getElementById('codeBox').style.display = 'block'
  document.getElementById('roomCode').innerText = code
  window.scrollTo({top:document.getElementById('codeBox').offsetTop, behavior:'smooth'})
}

// زرار الدخول بالكود
function joinWithCode(){
  let name = document.getElementById('playerName').value
  let code = document.getElementById('joinCode').value
  if(name == '' || code == ''){alert('⚠️ اكتب اسمك والكود'); return}
  alert('هندخلك الغرفة: ' + code)
}

// نسخ الكود
function copyCode(){
  let code = document.getElementById('roomCode').innerText
  navigator.clipboard.writeText(code)
  alert('✅ تم نسخ الكود: ' + code)
}
</script>
</body>
</html>
