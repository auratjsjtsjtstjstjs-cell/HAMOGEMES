<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:'Cairo';text-align:center;padding:20px}
.screen{display:none}.screen.active{display:block}
.btn{padding:16px 20px;margin:12px;border:none;border-radius:14px;font-weight:900;cursor:pointer;font-family:'Cairo';font-size:17px;width:85%;max-width:400px}
.btn-primary{background:linear-gradient(90deg,#00aaff,#0088ff);color:#fff}
.btn-secondary{background:linear-gradient(90deg,#ff8800,#ff5500);color:#fff}
.btn-ai{background:linear-gradient(90deg,#a855f7,#7c3aed);color:#fff}
input{width:85%;max-width:350px;padding:14px;border-radius:12px;border:2px solid #333;background:#222;color:#fff;text-align:center;font-family:'Cairo';font-size:16px}
.room-code-box{background:#111;border:3px dashed #ffd700;padding:20px;border-radius:15px;margin:20px auto;max-width:400px}
.room-code{font-size:40px;color:#ffd700;font-weight:900;letter-spacing:5px}
.players-list{background:#111;padding:15px;border-radius:10px;margin:15px auto;max-width:400px;text-align:right}
</style>
</head>
<body>

<h1>⚽ مزاد النجوم ⚽</h1>

<!-- الشاشة 1: اللوبي -->
<div id="lobby" class="screen active">
  <input id="playerName" placeholder="اكتب اسمك">
  <br>
  <button class="btn btn-primary" onclick="createRoom()">👥 انشاء غرفة مع صديق</button>
  <button class="btn btn-secondary" onclick="joinRandom()">⚡ غرفة عشوائية</button>
  <button class="btn btn-ai" onclick="playVsAI()">🤖 اللعب ضد الذكاء الاصطناعي</button>
  <br>
  <input id="joinCode" placeholder="ادخل كود الغرفة">
  <button class="btn btn-primary" onclick="joinWithCode()">دخول بالكود</button>
</div>

<!-- الشاشة 2: انتظار واظهار الكود -->
<div id="waiting" class="screen">
  <h2>في انتظار اللاعب التاني...</h2>
  <div class="room-code-box">
    <p>كود الغرفة بتاعك</p>
    <div class="room-code" id="roomCodeDisplay"></div>
    <button class="btn btn-primary" onclick="copyCode()">نسخ الكود</button>
  </div>
  <div class="players-list" id="playersInRoom"></div>
  <button class="btn btn-primary" id="startBtn" onclick="startGame()" style="display:none">ابدأ المزاد</button>
</div>

<script>
const SUPABASE_URL = 'https://kejrfxtuohynrrwazsfw.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlanJmeHR1b2h5bnJyd2F6c2Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mjk5MzYsImV4cCI6MjEwMjQwNTkzNn0.R5F76eRpG4_8KjBRNufsITOc5nx1xrMIHZlmMhAW3ZA'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let myName='', myRoom='', isHost=false, channel=null

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
}

async function createRoom(){
  myName = document.getElementById('playerName').value
  if(!myName) return alert('اكتب اسمك الاول')
  myRoom = Math.random().toString(36).substring(2,6).toUpperCase()
  isHost = true

  await supabase.from('rooms').insert([{room_code:myRoom, host_id:myName, players:[myName]}])

  showScreen('waiting')
  document.getElementById('roomCodeDisplay').innerText = myRoom // هنا بيظهر الكود كبير
  joinChannel()
}

async function joinRandom(){
  myName = document.getElementById('playerName').value
  if(!myName) return alert('اكتب اسمك الاول')
  let {data} = await supabase.from('rooms').select().limit(20)
  let openRoom = data.find(r=>r.players.length<2)
  if(openRoom){
    myRoom=openRoom.room_code; joinRoom()
  } else {
    alert('مفيش غرف فاضية. اعمل غرفة جديدة')
  }
}

async function joinWithCode(){
  myName = document.getElementById('playerName').value
  myRoom = document.getElementById('joinCode').value.toUpperCase()
  if(!myName ||!myRoom) return alert('اكتب اسمك والكود')
  joinRoom()
}

async function joinRoom(){
  let {data} = await supabase.from('rooms').select().eq('room_code',myRoom).single()
  if(!data) return alert('الغرفة مش موجودة')
  if(data.players.length>=2) return alert('الغرفة مليانة')
  let newPlayers = [...data.players, myName]
  await supabase.from('rooms').update({players:newPlayers}).eq('room_code',myRoom)
  showScreen('waiting')
  document.getElementById('roomCodeDisplay').innerText = myRoom
  joinChannel()
}

function joinChannel(){
  channel = supabase.channel('room-'+myRoom)
 .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:`room_code=eq.${myRoom}`},payload=>{
    let players = payload.new.players
    document.getElementById('playersInRoom').innerHTML = players.map(p=>`👤 ${p}`).join('<br>')
    if(players.length==2 && isHost) document.getElementById('startBtn').style.display='block'
  }).subscribe()
}

function copyCode(){
  navigator.clipboard.writeText(myRoom)
  alert('تم نسخ الكود: ' + myRoom)
}

function startGame(){
  window.location.href = `mazad-online.html?room=${myRoom}&name=${myName}`
}

// الزرار الجديد: يودي على صفحة AI
function playVsAI(){
  myName = document.getElementById('playerName').value
  if(!myName) return alert('اكتب اسمك الاول')
  window.location.href = `mazad2.html?name=${myName}`
}
</script>
</body>
</html>
