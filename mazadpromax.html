<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مزاد النجوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Cairo';color:#fff;min-height:100vh;
  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000);
  background-size: 400% 400%; animation: gradient 15s ease infinite;
}
@keyframes gradient {0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}}
.container{max-width:500px;margin:0 auto;padding:30px 20px;text-align:center}
.logo{font-size:45px;font-weight:900;margin-bottom:10px;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(0,0,0,0.6);backdrop-filter:blur(15px);border:2px solid rgba(255,215,0,0.3);border-radius:20px;padding:25px;margin:20px 0}
input{width:100%;padding:16px;margin:12px 0;border-radius:12px;border:2px solid #444;background:rgba(0,0,0,0.7);color:#fff;text-align:center;font-size:17px}
.btn{width:100%;padding:16px;margin:10px 0;border:none;border-radius:14px;font-weight:900;cursor:pointer;font-size:18px}
.btn-primary{background:linear-gradient(90deg,#00aaff,#0088ff);color:#fff}
.btn-secondary{background:linear-gradient(90deg,#ff8800,#ff5500);color:#fff}
.btn-ai{background:linear-gradient(90deg,#a855f7,#7c3aed);color:#fff}
.code-box{display:none;background:rgba(0,0,0,0.8);border:3px dashed gold;padding:25px;margin:20px 0;border-radius:20px}
.code{font-size:45px;color:gold;font-weight:900;letter-spacing:8px}
.waiting{color:#00ff88;font-weight:900;margin-top:10px}
</style>
</head>
<body>

<div class="container">
  <div class="logo">⚽ مزاد النجوم ⚽</div>
  <p style="color:#aaa;margin-bottom:30px">العب مع صحابك او ضد الذكاء الاصطناعي</p>

  <div class="card">
    <input id="playerName" placeholder="✨ اكتب اسمك الاسطوري ✨">
    <button class="btn btn-primary" onclick="createRoom()">👥 انشاء غرفة مع صديق</button>
    <button class="btn btn-secondary" onclick="alert('قريباً')">⚡ غرفة عشوائية</button>
    <button class="btn btn-ai" onclick="playVsAI()">🤖 اللعب ضد الذكاء الاصطناعي</button>
    <hr style="border:1px solid #333;margin:20px 0">
    <input id="joinCode" placeholder="🔑 ادخل كود الغرفة هنا">
    <button class="btn btn-primary" onclick="joinWithCode()">دخول بالكود</button>
  </div>

  <div class="card code-box" id="codeBox">
    <h2>🔥 الكود بتاعك 🔥</h2>
    <div class="code" id="roomCode"></div>
    <p style="color:#aaa">ابعت الكود ده لصاحبك</p>
    <p class="waiting" id="waitingMsg">⏳ مستني اللاعب التاني...</p>
    <button class="btn btn-primary" onclick="copyCode()">نسخ الكود</button>
    <button class="btn btn-secondary" onclick="startGame()">ابدأ اللعبة</button>
  </div>
</div>

<script>
// الكونفج بتاعك
const firebaseConfig = {
  apiKey: "AIzaSyC_55Rv6wCni9EwQurtUILswB1WjkXp6hM",
  authDomain: "mazad-noogom.firebaseapp.com",
  databaseURL: "https://mazad-noogom-default-rtdb.firebaseio.com",
  projectId: "mazad-noogom",
  storageBucket: "mazad-noogom.firebasestorage.app",
  messagingSenderId: "183884985831",
  appId: "1:183884985831:web:db231949dace2b0798b942"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRoom = '';
let playerName = '';

// AI
function playVsAI(){
  playerName = document.getElementById('playerName').value
  if(playerName == ''){alert('⚠️ اكتب اسمك الاول'); return}
  window.location.href = 'mazad2.html?name=' + playerName
}

// انشاء غرفة - بيعمل الغرفة في Firebase
function createRoom(){
  playerName = document.getElementById('playerName').value
  if(playerName == ''){alert('⚠️ اكتب اسمك الاول'); return}
  currentRoom = Math.random().toString(36).substring(2,6).toUpperCase()
  
  // نعمل الغرفة فاضيه
  db.ref('rooms/' + currentRoom).set({
    player1: playerName,
    player2: null,
    status: 'waiting',
    m1: 200000000,
    m2: 200000,
    t1: Array(11).fill(null),
    t2: Array(11).fill(null),
    currentPos: 0,
    currentBid: 0,
    highestBidder: 0,
    turn: 1
  })

  document.getElementById('codeBox').style.display = 'block'
  document.getElementById('roomCode').innerText = currentRoom
  window.scrollTo({top:document.getElementById('codeBox').offsetTop, behavior:'smooth'})
  
  // نسمع لو حد دخل
  listenToRoom(currentRoom)
}

// دخول بالكود
function joinWithCode(){
  playerName = document.getElementById('playerName').value
  let code = document.getElementById('joinCode').value.toUpperCase()
  if(playerName == '' || code == ''){alert('⚠️ اكتب اسمك والكود'); return}
  
  db.ref('rooms/' + code).once('value').then(snapshot => {
    if(!snapshot.exists()){alert('❌ الكود غلط'); return}
    db.ref('rooms/' + code).update({
      player2: playerName,
      status: 'ready'
    })
    // نروح على طول على المزاد
    window.location.href = `mazad6.html?room=${code}&name=${playerName}`
  })
}

// نسخ
function copyCode(){
  let code = document.getElementById('roomCode').innerText
  navigator.clipboard.writeText(code)
  alert('✅ تم نسخ الكود: ' + code)
}

// بدء - حتى لو التاني لسه مدخلش
function startGame(){
  if(currentRoom == '') return;
  window.location.href = `mazad6.html?room=${currentRoom}&name=${playerName}`
}

// نسمع الغرفة
function listenToRoom(code){
  db.ref('rooms/' + code).on('value', (snapshot) => {
    let data = snapshot.val()
    if(data && data.status === 'ready'){
      document.getElementById('waitingMsg').innerText = '✅ ' + data.player2 + ' دخل! جاهز'
    }
  })
}
</script>
</body>
</html>
